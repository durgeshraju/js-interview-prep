c:'<span class="cm">// Quick-fire: Answer each one</span>\n\n<span class="kw">typeof</span> <span class="kw">null</span>           <span class="cm">// "object" (famous bug!)</span>\n<span class="kw">typeof</span> <span class="kw">undefined</span>      <span class="cm">// "undefined"</span>\n<span class="kw">typeof</span> NaN            <span class="cm">// "number" (NaN is a number!)</span>\n<span class="kw">typeof</span> []             <span class="cm">// "object" (arrays are objects)</span>\n<span class="kw">typeof</span> (() =&gt; {})     <span class="cm">// "function"</span>\n\nNaN === NaN            <span class="cm">// false (NaN ≠ anything, even itself!)</span>\nNumber.isNaN(NaN)      <span class="cm">// true (correct way to check)</span>\n\n<span class="num">0.1</span> + <span class="num">0.2</span> === <span class="num">0.3</span>     <span class="cm">// false! (0.30000000000000004)</span>\n<span class="cm">// Fix: Math.abs(0.1 + 0.2 - 0.3) &lt; Number.EPSILON</span>\n\n[] == ![]              <span class="cm">// true! (both coerce to 0)</span>\n[] + []                <span class="cm">// "" (empty string!)</span>\n[] + {}                <span class="cm">// "[object Object]"</span>\n{} + []                <span class="cm">// 0 (block + unary plus)</span>\n\n<span class="str">"2"</span> + <span class="num">1</span>               <span class="cm">// "21" (string wins with +)</span>\n<span class="str">"2"</span> - <span class="num">1</span>               <span class="cm">// 1 (- forces number)</span>\n<span class="kw">true</span> + <span class="kw">true</span>           <span class="cm">// 2 (true → 1)</span>\n<span class="str">"b"</span> + <span class="str">"a"</span> + +<span class="str">"a"</span> + <span class="str">"a"</span>  <span class="cm">// "baNaNa" 🍌</span>',
q:[{q:"Why is [] == ![] true?",a:"Step by step: ![] is false (any object is truthy, !truthy = false). So [] == false. Both sides coerce to numbers: [] → 0, false → 0. 0 == 0 is true. This is why we always use === — no coercion, no surprises."},{q:"How do you correctly check for NaN?",a:"Use Number.isNaN(value). NOT the global isNaN() which coerces first (isNaN('hello') returns true, which is wrong). Or use value !== value — NaN is the only value that's not equal to itself."}]},
{id:"gotcha2",n:"🧠 Gotcha: Tricky Scope & Closures",d:"advanced",
e:'These questions are commonly asked at <strong>senior-level interviews at FAANG companies</strong>. They combine multiple concepts: closures, hoisting, IIFE, and setTimeout. The interviewer wants to see you THINK through the problem step by step, not just memorize answers.',
c:'<span class="cm">// GOTCHA 1: What does this print?</span>\n<span class="kw">function</span> <span class="fn">createFunctions</span>() {\n  <span class="kw">var</span> result = [];\n  <span class="kw">for</span> (<span class="kw">var</span> i = <span class="num">0</span>; i &lt; <span class="num">3</span>; i++) {\n    result.push(<span class="kw">function</span>() { <span class="kw">return</span> i; });\n  }\n  <span class="kw">return</span> result;\n}\n<span class="kw">const</span> fns = createFunctions();\nfns[<span class="num">0</span>](); <span class="cm">// 3 (not 0!)</span>\nfns[<span class="num">1</span>](); <span class="cm">// 3 (not 1!)</span>\nfns[<span class="num">2</span>](); <span class="cm">// 3 (not 2!)</span>\n<span class="cm">// All return 3 — same var i, closure captures REFERENCE</span>\n\n<span class="cm">// GOTCHA 2: Variable shadowing</span>\n<span class="kw">var</span> a = <span class="num">10</span>;\n(<span class="kw">function</span>() {\n  console.log(a);  <span class="cm">// undefined (not 10!)</span>\n  <span class="kw">var</span> a = <span class="num">20</span>;\n  console.log(a);  <span class="cm">// 20</span>\n})();\n\n<span class="cm">// GOTCHA 3: Block scope surprise</span>\n<span class="kw">let</span> x = <span class="num">1</span>;\n{\n  <span class="cm">// console.log(x); ← ReferenceError! TDZ!</span>\n  <span class="kw">let</span> x = <span class="num">2</span>;  <span class="cm">// this x shadows the outer x</span>\n  console.log(x); <span class="cm">// 2</span>\n}\nconsole.log(x); <span class="cm">// 1 (outer x unchanged)</span>',
q:[{q:"How would you fix createFunctions to return 0,1,2?",a:"Three ways: (1) Use let instead of var. (2) IIFE: result.push((function(j){ return function(){ return j; }; })(i)). (3) Use bind: result.push(function(j){ return j; }.bind(null, i)). All create a new scope/binding per iteration."},{q:"Why closures capture references, not values?",a:"Closures don't take a snapshot — they keep a LIVE link to the variable. When the function runs later, it reads the variable's CURRENT value. That's why var-in-loop gives all 3s — all closures point to the same i, which is 3 when they execute."}]},
{id:"live1",n:"💻 Live Code: Debounce with Cancel",d:"intermediate",
e:'This is the <strong>#1 most common live coding question</strong> in frontend interviews. Almost every company asks some version of "implement debounce." The twist: senior-level interviewers also ask for <strong>cancel</strong> and <strong>flush</strong> functionality. Practice writing this from memory — you should be able to code it in under 5 minutes.',
c:'<span class="cm">// TASK: Build a debounce function with cancel & flush</span>\n<span class="cm">// Requirements:</span>\n<span class="cm">// 1. Delay execution until N ms of inactivity</span>\n<span class="cm">// 2. .cancel() — stop the pending call</span>\n<span class="cm">// 3. .flush() — execute immediately</span>\n\n<span class="kw">function</span> <span class="fn">debounce</span>(fn, delay) {\n  <span class="kw">let</span> timer = <span class="kw">null</span>;\n  <span class="kw">let</span> lastArgs = <span class="kw">null</span>;\n\n  <span class="kw">function</span> <span class="fn">debounced</span>(...args) {\n    lastArgs = args;\n    clearTimeout(timer);\n    timer = setTimeout(() =&gt; {\n      fn.apply(<span class="kw">this</span>, lastArgs);\n      lastArgs = <span class="kw">null</span>;\n    }, delay);\n  }\n\n  debounced.cancel = () =&gt; {\n    clearTimeout(timer);\n    timer = <span class="kw">null</span>;\n    lastArgs = <span class="kw">null</span>;\n  };\n\n  debounced.flush = () =&gt; {\n    <span class="kw">if</span> (lastArgs) {\n      clearTimeout(timer);\n      fn.apply(<span class="kw">this</span>, lastArgs);\n      lastArgs = <span class="kw">null</span>;\n    }\n  };\n\n  <span class="kw">return</span> debounced;\n}\n\n<span class="cm">// Usage:</span>\n<span class="kw">const</span> search = debounce(q =&gt; fetch(<span class="str">`/api?q=${q}`</span>), <span class="num">300</span>);\ninput.oninput = e =&gt; search(e.target.value);\n<span class="cm">// search.cancel(); — user navigated away</span>\n<span class="cm">// search.flush();  — user pressed Enter</span>',
q:[{q:"Walk me through your debounce implementation.",a:"I store the timer ID and latest args in closure. Each call clears the previous timer and sets a new one. After 'delay' ms of no calls, it fires with the latest args. cancel() clears the timer. flush() fires immediately if there are pending args. I use apply() to preserve 'this' context."},{q:"Follow-up: Add a 'leading' option.",a:"Add an 'immediate' parameter. On first call, if immediate=true AND no pending timer, execute immediately. Then set the timer to block further calls during the delay period. After delay, allow the next call to fire immediately again."}]},
{id:"live2",n:"💻 Live Code: Event Emitter",d:"intermediate",
e:'Build your own Pub/Sub system. This tests <strong>design patterns, closures, and data structure choice</strong>. Asked frequently at <strong>Meta, Google, and startups</strong>. You need on(), off(), emit(), and once(). Senior follow-up: handle errors in listeners, add priority ordering.',
c:'<span class="cm">// TASK: Implement EventEmitter with on/off/emit/once</span>\n\n<span class="kw">class</span> <span class="fn">EventEmitter</span> {\n  <span class="fn">constructor</span>() {\n    <span class="kw">this</span>.events = <span class="kw">new</span> Map();\n  }\n\n  <span class="fn">on</span>(event, listener) {\n    <span class="kw">if</span> (!<span class="kw">this</span>.events.has(event))\n      <span class="kw">this</span>.events.set(event, []);\n    <span class="kw">this</span>.events.get(event).push(listener);\n    <span class="kw">return</span> () =&gt; <span class="kw">this</span>.off(event, listener); <span class="cm">// unsubscribe</span>\n  }\n\n  <span class="fn">off</span>(event, listener) {\n    <span class="kw">const</span> cbs = <span class="kw">this</span>.events.get(event);\n    <span class="kw">if</span> (!cbs) <span class="kw">return</span>;\n    <span class="kw">this</span>.events.set(\n      event,\n      cbs.filter(cb =&gt; cb !== listener)\n    );\n  }\n\n  <span class="fn">emit</span>(event, ...args) {\n    <span class="kw">const</span> cbs = <span class="kw">this</span>.events.get(event);\n    <span class="kw">if</span> (!cbs) <span class="kw">return</span>;\n    cbs.forEach(cb =&gt; {\n      <span class="kw">try</span> { cb(...args); }\n      <span class="kw">catch</span>(e) { console.error(e); } <span class="cm">// don\'t kill others</span>\n    });\n  }\n\n  <span class="fn">once</span>(event, listener) {\n    <span class="kw">const</span> wrapper = (...args) =&gt; {\n      listener(...args);\n      <span class="kw">this</span>.off(event, wrapper); <span class="cm">// auto-remove after 1 call</span>\n    };\n    <span class="kw">return this</span>.on(event, wrapper);\n  }\n}\n\n<span class="cm">// Test it</span>\n<span class="kw">const</span> ee = <span class="kw">new</span> EventEmitter();\n<span class="kw">const</span> unsub = ee.on(<span class="str">"data"</span>, d =&gt; console.log(d));\nee.once(<span class="str">"data"</span>, d =&gt; console.log(<span class="str">"once:"</span>, d));\nee.emit(<span class="str">"data"</span>, <span class="str">"hello"</span>);  <span class="cm">// "hello", "once: hello"</span>\nee.emit(<span class="str">"data"</span>, <span class="str">"world"</span>);  <span class="cm">// "world" (once removed)</span>\nunsub(); <span class="cm">// unsubscribe</span>',
q:[{q:"Why use try/catch in emit?",a:"If one listener throws, it shouldn't kill the other listeners. Without try/catch, an error in listener #1 would prevent listeners #2, #3, etc. from running. This is a production-quality detail interviewers look for."},{q:"Why return unsubscribe function from on()?",a:"It's a clean API pattern (used by React useEffect). The caller doesn't need to keep a reference to the listener function — just call the returned function. Prevents bugs where someone passes an anonymous function to on() and can never remove it."}]},
{id:"live3",n:"💻 Live Code: Throttled API + Retry",d:"advanced",
e:'This is a <strong>real-world problem</strong> companies like Uber and Stripe ask. Build a function that calls an API with retry logic and rate limiting. It tests <strong>async/await, error handling, and practical engineering judgment</strong>.',
c:'<span class="cm">// TASK: Fetch with retry + exponential backoff</span>\n\n<span class="kw">async function</span> <span class="fn">fetchWithRetry</span>(url, options = {}) {\n  <span class="kw">const</span> {\n    retries = <span class="num">3</span>,\n    backoff = <span class="num">1000</span>,  <span class="cm">// start delay</span>\n    timeout = <span class="num">5000</span>,\n  } = options;\n\n  <span class="kw">for</span> (<span class="kw">let</span> attempt = <span class="num">0</span>; attempt &lt;= retries; attempt++) {\n    <span class="kw">try</span> {\n      <span class="kw">const</span> controller = <span class="kw">new</span> AbortController();\n      <span class="kw">const</span> timer = setTimeout(\n        () =&gt; controller.abort(), timeout\n      );\n\n      <span class="kw">const</span> res = <span class="kw">await</span> fetch(url, {\n        signal: controller.signal\n      });\n      clearTimeout(timer);\n\n      <span class="kw">if</span> (!res.ok) <span class="kw">throw new</span> Error(<span class="str">`HTTP ${res.status}`</span>);\n      <span class="kw">return await</span> res.json();\n\n    } <span class="kw">catch</span> (err) {\n      <span class="kw">const</span> isLast = attempt === retries;\n      <span class="kw">if</span> (isLast) <span class="kw">throw</span> err;\n\n      <span class="cm">// Exponential backoff: 1s, 2s, 4s...</span>\n      <span class="kw">const</span> delay = backoff * Math.pow(<span class="num">2</span>, attempt);\n      console.log(<span class="str">`Retry ${attempt + 1} in ${delay}ms`</span>);\n      <span class="kw">await new</span> Promise(r =&gt; setTimeout(r, delay));\n    }\n  }\n}\n\n<span class="cm">// Usage</span>\n<span class="kw">const</span> data = <span class="kw">await</span> fetchWithRetry(<span class="str">"/api/users"</span>, {\n  retries: <span class="num">3</span>, backoff: <span class="num">1000</span>, timeout: <span class="num">5000</span>\n});',
q:[{q:"Why exponential backoff instead of fixed retry?",a:"Fixed retry (every 1s) can overwhelm a struggling server. Exponential backoff (1s, 2s, 4s, 8s) gives the server increasing time to recover. It's standard practice in production systems. Bonus: add jitter (random small delay) to prevent all clients retrying simultaneously."},{q:"When should you NOT retry?",a:"Don't retry 4xx errors (400 Bad Request, 401 Unauthorized, 403 Forbidden) — these won't succeed on retry. Only retry 5xx (server errors) and network failures. Also don't retry non-idempotent operations (like payments) without careful deduplication."}]},
{id:"live4",n:"💻 Live Code: LRU Cache",d:"advanced",
e:'<strong>Amazon and Google\'s favorite</strong> data structure question. Build a cache that automatically removes the LEAST Recently Used item when full. Tests: <strong>Map ordering, data structures, and O(1) performance thinking</strong>. JavaScript\'s Map remembers insertion order — this is the secret weapon.',
c:'<span class="cm">// TASK: Build LRU Cache with get() and put()</span>\n<span class="cm">// Both operations must be O(1)!</span>\n\n<span class="kw">class</span> <span class="fn">LRUCache</span> {\n  <span class="fn">constructor</span>(capacity) {\n    <span class="kw">this</span>.capacity = capacity;\n    <span class="kw">this</span>.cache = <span class="kw">new</span> Map(); <span class="cm">// Map preserves order!</span>\n  }\n\n  <span class="fn">get</span>(key) {\n    <span class="kw">if</span> (!<span class="kw">this</span>.cache.has(key)) <span class="kw">return</span> <span class="num">-1</span>;\n\n    <span class="cm">// Move to end (most recently used)</span>\n    <span class="kw">const</span> val = <span class="kw">this</span>.cache.get(key);\n    <span class="kw">this</span>.cache.delete(key);\n    <span class="kw">this</span>.cache.set(key, val);\n    <span class="kw">return</span> val;\n  }\n\n  <span class="fn">put</span>(key, value) {\n    <span class="cm">// If exists, delete first (to re-insert at end)</span>\n    <span class="kw">if</span> (<span class="kw">this</span>.cache.has(key))\n      <span class="kw">this</span>.cache.delete(key);\n\n    <span class="cm">// If full, remove FIRST item (least recently used)</span>\n    <span class="kw">if</span> (<span class="kw">this</span>.cache.size &gt;= <span class="kw">this</span>.capacity) {\n      <span class="kw">const</span> oldest = <span class="kw">this</span>.cache.keys().next().value;\n      <span class="kw">this</span>.cache.delete(oldest);\n    }\n\n    <span class="kw">this</span>.cache.set(key, value);\n  }\n}\n\n<span class="cm">// Test</span>\n<span class="kw">const</span> c = <span class="kw">new</span> LRUCache(<span class="num">2</span>);\nc.put(<span class="num">1</span>, <span class="str">"a"</span>);\nc.put(<span class="num">2</span>, <span class="str">"b"</span>);\nc.get(<span class="num">1</span>);        <span class="cm">// "a" — makes 1 recently used</span>\nc.put(<span class="num">3</span>, <span class="str">"c"</span>);  <span class="cm">// evicts key 2 (least recent)</span>\nc.get(<span class="num">2</span>);        <span class="cm">// -1 (evicted!)</span>',
q:[{q:"Why use Map instead of Object for LRU?",a:"Map preserves insertion order AND allows O(1) delete + re-insert. Object doesn't guarantee key order (numbers are sorted). Map also has .size (instant count) and .keys().next() to get the oldest entry. This trick gives us O(1) for both get and put."},{q:"How would you add TTL (time-to-live)?",a:"Store {value, expiry: Date.now() + ttl} instead of just value. In get(), check if Date.now() > expiry — if so, delete and return -1. Optionally run a cleanup interval to remove expired entries proactively."}]},
{id:"sysdesign1",n:"🏗️ System Design: Chat Application",d:"advanced",
e:'A classic frontend system design question at <strong>Meta, Google, and Slack</strong>. You\'re expected to discuss: real-time communication (WebSocket vs polling), message state management, optimistic updates, offline support, and scaling considerations. Think out loud — the interviewer wants to see your PROCESS.',
c:'<span class="cm">// KEY ARCHITECTURE DECISIONS:</span>\n\n<span class="cm">// 1. REAL-TIME: WebSocket (bidirectional, persistent)</span>\n<span class="kw">const</span> ws = <span class="kw">new</span> WebSocket(<span class="str">"wss://chat.app/ws"</span>);\nws.onmessage = (e) =&gt; {\n  <span class="kw">const</span> msg = JSON.parse(e.data);\n  store.dispatch(addMessage(msg));\n};\n<span class="cm">// Fallback: SSE or long-polling for older browsers</span>\n\n<span class="cm">// 2. STATE: Normalized store</span>\n<span class="cm">// messages: { byId: { m1: {...}, m2: {...} } }</span>\n<span class="cm">// channels: { byId: { c1: { messageIds: ["m1","m2"] } } }</span>\n<span class="cm">// ❌ Don\'t: nest messages inside channels</span>\n\n<span class="cm">// 3. OPTIMISTIC UPDATES</span>\n<span class="kw">function</span> <span class="fn">sendMessage</span>(text) {\n  <span class="kw">const</span> tempId = <span class="str">"temp_"</span> + Date.now();\n  <span class="cm">// Show immediately (optimistic)</span>\n  addToUI({ id: tempId, text, status: <span class="str">"sending"</span> });\n  <span class="cm">// Send to server</span>\n  ws.send(JSON.stringify({ text }));\n  <span class="cm">// On ACK: replace tempId with real ID</span>\n  <span class="cm">// On FAIL: show retry button</span>\n}\n\n<span class="cm">// 4. VIRTUALIZATION — render only visible messages</span>\n<span class="cm">// 10,000 messages? Only render ~20 visible ones</span>\n<span class="cm">// Use react-virtual or react-window</span>\n\n<span class="cm">// 5. OFFLINE: IndexedDB + service worker</span>\n<span class="cm">// Queue messages when offline</span>\n<span class="cm">// Sync when back online</span>\n<span class="cm">// Show "offline" indicator</span>',
q:[{q:"How would you structure the chat app state?",a:"Normalized flat structure: messages.byId (Map of all messages), channels.byId (each has messageIds array), users.byId. Never nest messages inside channels — it causes duplication and update pain. Use selectors to derive views. Separate UI state (typing indicators, scroll position) from data state."},{q:"WebSocket vs Server-Sent Events vs Polling?",a:"WebSocket: bidirectional, persistent, best for chat (both send and receive). SSE: server-to-client only, auto-reconnect, good for notifications. Long-polling: fallback, high overhead. Short-polling: simple but wasteful. For chat, WebSocket is the clear choice — you need to SEND messages too, not just receive."}]},
{id:"sysdesign2",n:"🏗️ System Design: Infinite Scroll Feed",d:"advanced",
e:'Asked at <strong>Meta (Facebook/Instagram feed), Twitter, and LinkedIn</strong>. You need to handle: fetching pages of data, virtualized rendering, scroll position restoration, loading/error states, and memory management. The key insight: you can\'t keep 10,000 DOM nodes alive.',
c:'<span class="cm">// ARCHITECTURE:</span>\n\n<span class="cm">// 1. PAGINATION: Cursor-based (not offset!)</span>\n<span class="kw">async function</span> <span class="fn">loadMore</span>(cursor) {\n  <span class="kw">const</span> { posts, nextCursor } = <span class="kw">await</span> fetch(\n    <span class="str">`/api/feed?after=${cursor}&limit=20`</span>\n  ).then(r =&gt; r.json());\n  <span class="cm">// cursor = last item ID — stable even if new posts added</span>\n  <span class="cm">// offset breaks when items are inserted/deleted</span>\n}\n\n<span class="cm">// 2. TRIGGER: IntersectionObserver (not scroll event!)</span>\n<span class="kw">const</span> observer = <span class="kw">new</span> IntersectionObserver(([entry]) =&gt; {\n  <span class="kw">if</span> (entry.isIntersecting &amp;&amp; !loading &amp;&amp; hasMore) {\n    loadMore(cursor);\n  }\n});\nobserver.observe(sentinelElement); <span class="cm">// invisible div at bottom</span>\n\n<span class="cm">// 3. VIRTUALIZATION: Only render visible items</span>\n<span class="cm">// Window of ~20 items rendered</span>\n<span class="cm">// Items above/below: spacer divs with correct height</span>\n<span class="cm">// Keeps DOM size constant regardless of data size</span>\n\n<span class="cm">// 4. MEMORY: Release old items</span>\n<span class="cm">// Keep data for ~200 items max</span>\n<span class="cm">// User scrolls up? Re-fetch from cache/server</span>\n<span class="cm">// Store scroll position before unmount</span>\n\n<span class="cm">// 5. STATES: loading, error, empty, hasMore</span>\n<span class="cm">// Show skeleton placeholders while loading</span>\n<span class="cm">// "Pull to refresh" at top</span>\n<span class="cm">// "You\'re all caught up" at bottom</span>',
q:[{q:"Why cursor pagination over offset?",a:"Offset breaks when items change. If you're at offset 20 and 5 new posts are added at the top, offset 20 now shows items you've already seen. Cursor says 'give me items after THIS item' — it's stable regardless of insertions or deletions."},{q:"How do you handle scroll position restoration?",a:"Before navigating away: save scrollY and the ID of the first visible item. On return: restore data from cache, find the saved item in the list, scroll to it. Virtualized lists make this tricky — you may need to calculate total height from item heights. Libraries like react-virtual handle this with scrollToIndex()."}]},
{id:"sysdesign3",n:"🏗️ System Design: Auto-Complete Search",d:"advanced",
e:'Asked at <strong>Google, Amazon, and Airbnb</strong>. Design a search box with suggestions. Key challenges: debouncing, caching, race conditions (results arriving out of order), keyboard navigation, and accessibility. This is a deceptively complex UI problem.',
c:'<span class="cm">// COMPLETE SOLUTION:</span>\n\n<span class="kw">function</span> <span class="fn">AutoComplete</span>() {\n  <span class="kw">let</span> cache = <span class="kw">new</span> Map();      <span class="cm">// query → results cache</span>\n  <span class="kw">let</span> controller = <span class="kw">null</span>;     <span class="cm">// AbortController for race conditions</span>\n\n  <span class="kw">const</span> <span class="fn">search</span> = debounce(<span class="kw">async</span> (query) =&gt; {\n    <span class="kw">if</span> (!query) <span class="kw">return</span> showResults([]);\n\n    <span class="cm">// 1. CHECK CACHE</span>\n    <span class="kw">if</span> (cache.has(query))\n      <span class="kw">return</span> showResults(cache.get(query));\n\n    <span class="cm">// 2. CANCEL previous request (race condition fix!)</span>\n    <span class="kw">if</span> (controller) controller.abort();\n    controller = <span class="kw">new</span> AbortController();\n\n    <span class="kw">try</span> {\n      <span class="kw">const</span> res = <span class="kw">await</span> fetch(\n        <span class="str">`/api/search?q=${query}`</span>,\n        { signal: controller.signal }\n      );\n      <span class="kw">const</span> data = <span class="kw">await</span> res.json();\n      cache.set(query, data); <span class="cm">// cache it</span>\n      showResults(data);\n    } <span class="kw">catch</span> (e) {\n      <span class="kw">if</span> (e.name !== <span class="str">"AbortError"</span>) showError(e);\n    }\n  }, <span class="num">300</span>);\n\n  <span class="cm">// 3. KEYBOARD NAV: ArrowUp/Down/Enter/Escape</span>\n  <span class="cm">// 4. ACCESSIBILITY: role="combobox", aria-expanded,</span>\n  <span class="cm">//    aria-activedescendant, role="listbox"</span>\n  <span class="cm">// 5. HIGHLIGHT matching text in results</span>\n}',
q:[{q:"How do you handle race conditions in search?",a:"Problem: user types 'ab', then 'abc'. The 'ab' request might return AFTER 'abc'. Fix: use AbortController — abort the previous request when a new one starts. This way, only the latest query's results are shown. Always catch AbortError and ignore it."},{q:"What accessibility requirements for autocomplete?",a:"Input: role='combobox', aria-expanded, aria-autocomplete='list'. Results list: role='listbox'. Each result: role='option', id for aria-activedescendant. Handle keyboard: ArrowDown/Up (navigate), Enter (select), Escape (close). Screen readers must announce the selected option."}]}
]}];

let ck={},bm={},cv='all',cp='all',sq='',oP=new Set(),oT=new Set();
function ls(){try{ck=JSON.parse(localStorage.getItem('jsc')||'{}');bm=JSON.parse(localStorage.getItem('jsb')||'{}');if(localStorage.getItem('jst')==='light')document.body.classList.add('light');}catch(e){}}
function ss(){try{localStorage.setItem('jsc',JSON.stringify(ck));localStorage.setItem('jsb',JSON.stringify(bm));}catch(e){}}

function initTabs(){
  const names=['All','Foundations','Functions','Objects','Async','Patterns','DOM & Perf','System Design','🔥 Mock Interview'];
  document.getElementById('ft').innerHTML=names.map((n,i)=>`<div class="ftab${i===0?' active':''}" onclick="fp(${i===0?"'all'":i},this)">${n}</div>`).join('');
}

function render(){
  const el=document.getElementById('content');let h='';
  D.forEach(ph=>{
    if(cp!=='all'&&cp!==ph.p)return;
    let th='',vis=0,dn=0;
    ph.topics.forEach(t=>{
      const ms=!sq||t.n.toLowerCase().includes(sq)||t.e.toLowerCase().includes(sq)||t.id.includes(sq);
      const mv=cv==='all'||(cv==='bookmarks'&&bm[t.id])||(cv==='done'&&ck[t.id])||(cv==='remaining'&&!ck[t.id]);
      if(!ms||!mv)return;
      vis++;if(ck[t.id])dn++;
      const bc=t.d==='beginner'?'badge-b':t.d==='intermediate'?'badge-i':'badge-a';
      let qa='';
      if(t.q){qa='<div class="qas"><div class="qal">Interview Questions</div>';t.q.forEach(x=>{qa+=`<div class="qai"><div class="qq">${x.q}</div><div class="qa">${x.a}</div></div>`;});qa+='</div>';}
      th+=`<div class="topic${oT.has(t.id)?' open':''}"><div class="th" onclick="tT('${t.id}')"><div class="tc${ck[t.id]?' checked':''}" onclick="event.stopPropagation();tC('${t.id}')">&#10003;</div><div class="tn">${t.n}</div><span class="badge ${bc}">${t.d}</span><div class="tb${bm[t.id]?' saved':''}" onclick="event.stopPropagation();tB('${t.id}')">&#9733;</div><div class="tchev">&#9662;</div></div><div class="tbody"><p>${t.e}</p><div class="cblock"><code>${t.c}</code></div>${qa}</div></div>`;
    });
    if(vis){
      h+=`<div class="phase${oP.has(ph.p)?' open':''}" data-p="${ph.p}"><div class="ph" onclick="tP(${ph.p})"><div class="pnum">${ph.p}</div><div class="pinfo"><div class="ptitle">${ph.t}</div><div class="psub">${ph.s}</div></div><span class="pprog">${dn}/${vis}</span><div class="pchev">&#9662;</div></div><div class="pbody">${th}</div></div>`;
    }
  });
  el.innerHTML=h;
  document.getElementById('emp').classList.toggle('show',!h.trim());
  uP();
}
function uP(){let tot=0,dn=0;D.forEach(p=>p.topics.forEach(t=>{tot++;if(ck[t.id])dn++;}));const pc=tot?Math.round(dn/tot*100):0;document.getElementById('pf').style.width=pc+'%';document.getElementById('pt').textContent=`${dn} / ${tot} completed (${pc}%)`;}
function tP(n){oP.has(n)?oP.delete(n):oP.add(n);render();}
function tT(id){oT.has(id)?oT.delete(id):oT.add(id);render();}
function tC(id){ck[id]=!ck[id];if(!ck[id])delete ck[id];ss();render();}
function tB(id){bm[id]=!bm[id];if(!bm[id])delete bm[id];ss();render();}
function toggleTheme(){document.body.classList.toggle('light');localStorage.setItem('jst',document.body.classList.contains('light')?'light':'dark');}
function toggleBmFilter(){cv=cv==='bookmarks'?'all':'bookmarks';document.getElementById('bmBtn').classList.toggle('active',cv==='bookmarks');uN();render();}
function doSearch(){sq=document.getElementById('si').value.toLowerCase().trim();render();}
function fp(p,el){cp=p;document.querySelectorAll('.ftab').forEach(t=>t.classList.remove('active'));if(el)el.classList.add('active');render();}
function showView(v){cv=v;document.getElementById('bmBtn').classList.toggle('active',v==='bookmarks');uN();render();}
function uN(){document.querySelectorAll('.ni').forEach(n=>n.classList.toggle('active',n.dataset.v===cv));}
ls();initTabs();render();
</script>
</body>
