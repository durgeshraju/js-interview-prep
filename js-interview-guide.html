<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0a0f">
<title>JS Interview Prep</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=DM+Sans:wght@400;500;600;700&display=swap');
:root{--bg:#0a0a0f;--bg2:#12121a;--bg3:#1a1a26;--card:#14141e;--border:#2a2a3a;--text:#e8e8f0;--text2:#9898b0;--accent:#6366f1;--accent2:#818cf8;--aglow:rgba(99,102,241,.15);--green:#34d399;--gbg:rgba(52,211,153,.1);--amber:#fbbf24;--abg:rgba(251,191,36,.1);--red:#f87171;--codebg:#0d0d15;--font:'DM Sans',-apple-system,sans-serif;--mono:'JetBrains Mono',monospace;--radius:12px;--shadow:0 4px 24px rgba(0,0,0,.3)}
.light{--bg:#f5f5f7;--bg2:#fff;--bg3:#eeeef2;--card:#fff;--border:#d8d8e0;--text:#1a1a2e;--text2:#6b6b80;--accent:#4f46e5;--accent2:#6366f1;--aglow:rgba(79,70,229,.08);--green:#059669;--gbg:rgba(5,150,105,.08);--amber:#d97706;--abg:rgba(217,119,6,.08);--red:#dc2626;--codebg:#f0f0f5;--shadow:0 4px 24px rgba(0,0,0,.08)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh;transition:background .3s,color .3s;padding-bottom:80px}
.header{position:sticky;top:0;z-index:100;background:var(--bg2);border-bottom:1px solid var(--border);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);padding:12px 16px}
.header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.logo{font-size:18px;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:-.5px}
.logo span{font-size:11px;opacity:.7;-webkit-text-fill-color:var(--text2);display:block;letter-spacing:0}
.hactions{display:flex;gap:8px}
.ibtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--border);background:var(--bg3);color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;transition:all .2s}
.ibtn:hover,.ibtn.active{background:var(--aglow);color:var(--accent);border-color:var(--accent)}
.sbox{display:flex;align-items:center;gap:8px;background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:8px 12px;transition:border-color .2s}
.sbox:focus-within{border-color:var(--accent)}
.sbox input{flex:1;border:none;background:none;color:var(--text);font-family:var(--font);font-size:14px;outline:none}
.sbox input::placeholder{color:var(--text2)}
.pbar-wrap{margin:16px 16px 8px;background:var(--bg3);border-radius:20px;height:6px;overflow:hidden}
.pbar-fill{height:100%;border-radius:20px;background:linear-gradient(90deg,var(--accent),var(--green));transition:width .5s cubic-bezier(.4,0,.2,1);width:0%}
.ptext{text-align:center;font-size:12px;color:var(--text2);margin:4px 0 12px;font-weight:500}
.ftabs{display:flex;gap:6px;padding:0 16px 12px;overflow-x:auto;scrollbar-width:none}
.ftabs::-webkit-scrollbar{display:none}
.ftab{flex-shrink:0;padding:6px 14px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:var(--bg3);color:var(--text2);transition:all .2s;white-space:nowrap}
.ftab.active,.ftab:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.phase{margin:16px;border-radius:var(--radius);border:1px solid var(--border);background:var(--card);overflow:hidden;box-shadow:var(--shadow);animation:fadeIn .4s ease both}
.ph{padding:16px;cursor:pointer;display:flex;align-items:center;gap:12px}
.ph:active{background:var(--aglow)}
.pnum{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.pinfo{flex:1}
.ptitle{font-size:15px;font-weight:700;letter-spacing:-.3px}
.psub{font-size:12px;color:var(--text2);margin-top:2px}
.pchev{font-size:18px;color:var(--text2);transition:transform .3s;flex-shrink:0}
.phase.open .pchev{transform:rotate(180deg)}
.pbody{display:none;border-top:1px solid var(--border)}
.phase.open .pbody{display:block}
.pprog{font-size:11px;color:var(--green);font-weight:600}
.topic{border-bottom:1px solid var(--border)}
.topic:last-child{border-bottom:none}
.th{padding:14px 16px;cursor:pointer;display:flex;align-items:center;gap:10px}
.th:active{background:var(--aglow)}
.tc{width:22px;height:22px;border-radius:6px;border:2px solid var(--border);background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s;color:transparent;font-size:13px}
.tc.checked{background:var(--green);border-color:var(--green);color:#fff}
.tn{flex:1;font-size:14px;font-weight:500}
.tc.checked~.tn{text-decoration:line-through;color:var(--text2)}
.tb{font-size:16px;color:var(--text2);cursor:pointer;padding:4px;transition:all .2s;flex-shrink:0}
.tb.saved{color:var(--amber)}
.tchev{font-size:14px;color:var(--text2);transition:transform .3s;flex-shrink:0}
.topic.open .tchev{transform:rotate(180deg)}
.tbody{display:none;padding:0 16px 16px 48px}
.topic.open .tbody{display:block}
.tbody p{font-size:13px;line-height:1.7;color:var(--text2);margin-bottom:12px}
.tbody strong{color:var(--text)}
.cblock{background:var(--codebg);border:1px solid var(--border);border-radius:8px;padding:12px;margin:10px 0;overflow-x:auto;-webkit-overflow-scrolling:touch}
.cblock code{font-family:var(--mono);font-size:11.5px;line-height:1.6;color:var(--text);white-space:pre}
.kw{color:#c792ea}.fn{color:#82aaff}.str{color:#c3e88d}.cm{color:#636c83;font-style:italic}.num{color:#f78c6c}.op{color:#89ddff}
.light .kw{color:#7c3aed}.light .fn{color:#2563eb}.light .str{color:#059669}.light .cm{color:#9ca3af}.light .num{color:#dc2626}.light .op{color:#0891b2}
.qas{margin-top:14px}
.qal{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--accent);margin-bottom:8px}
.qai{margin-bottom:10px}
.qq{font-size:13px;font-weight:600;color:var(--text);margin-bottom:4px;padding-left:12px;border-left:2px solid var(--accent)}
.qa{font-size:12px;color:var(--text2);padding-left:12px}
.badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:6px;text-transform:uppercase;letter-spacing:.5px;flex-shrink:0}
.badge-b{background:var(--gbg);color:var(--green)}
.badge-i{background:var(--abg);color:var(--amber)}
.badge-a{background:rgba(248,113,113,.1);color:var(--red)}
.bnav{position:fixed;bottom:0;left:0;right:0;background:var(--bg2);border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:8px 0 env(safe-area-inset-bottom,8px);z-index:100;backdrop-filter:blur(20px)}
.ni{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;padding:4px 16px;color:var(--text2);font-size:10px;font-weight:600;transition:color .2s}
.ni.active{color:var(--accent)}
.ni .nico{font-size:20px}
.empty{text-align:center;padding:60px 20px;color:var(--text2);display:none}
.empty.show{display:block}
.empty .emo{font-size:48px;margin-bottom:12px}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
</style>
</head>
<body>
<div class="header">
<div class="header-top">
<div class="logo">JS Interview Prep<span>Senior Frontend Engineer</span></div>
<div class="hactions">

<button class="ibtn" onclick="toggleTheme()">&#127769;</button>
</div>
</div>
<div class="sbox"><span style="color:var(--text2)">&#128269;</span><input type="text" id="si" placeholder="Search topics..." oninput="doSearch()"></div>
</div>
<div class="pbar-wrap"><div class="pbar-fill" id="pf"></div></div>

<script>
const D=[{p:1,t:"JavaScript Foundations",s:"Core language — warm-up round",topics:[
{id:"types",n:"Primitive Types & Coercion",d:"beginner",
e:'JS has <strong>7 primitives</strong>: string, number, bigint, boolean, undefined, null, symbol. Everything else is an object. Type coercion converts values implicitly — #1 source of tricky questions.',
c:'<span class="cm">// typeof quirks</span>\n<span class="kw">typeof</span> <span class="kw">null</span>        <span class="cm">// "object" (bug)</span>\n<span class="kw">typeof</span> NaN         <span class="cm">// "number"</span>\n<span class="kw">typeof</span> (() =&gt; {})  <span class="cm">// "function"</span>\n\n<span class="cm">// Coercion traps</span>\n<span class="str">"5"</span> + <span class="num">3</span>   <span class="cm">// "53" (string wins with +)</span>\n<span class="str">"5"</span> - <span class="num">3</span>   <span class="cm">// 2 (numeric with -)</span>\n<span class="kw">Boolean</span>(<span class="str">""</span>) <span class="cm">// false</span>',
q:[{q:"What are the 6 falsy values?",a:'false, 0, "" , null, undefined, NaN. Note: [] and {} are truthy!'},{q:"Why does typeof null === \"object\"?",a:"Legacy bug: null's type tag was 0 (same as objects) in original JS implementation."},{q:"Explain == vs ===",a:'== coerces types ("1"==1 true). === checks type AND value ("1"===1 false). Always use ===.'}]},
{id:"scope",n:"Scoping: var, let, const",d:"beginner",
e:'<strong>var</strong> is function-scoped, hoisted as undefined. <strong>let/const</strong> are block-scoped with Temporal Dead Zone (TDZ) — accessing before declaration throws ReferenceError.',
c:'<span class="cm">// Classic loop question</span>\n<span class="kw">for</span> (<span class="kw">var</span> i=<span class="num">0</span>; i&lt;<span class="num">3</span>; i++) {\n  setTimeout(() =&gt; console.log(i), <span class="num">100</span>);\n}\n<span class="cm">// 3,3,3 (var shared)</span>\n\n<span class="kw">for</span> (<span class="kw">let</span> i=<span class="num">0</span>; i&lt;<span class="num">3</span>; i++) {\n  setTimeout(() =&gt; console.log(i), <span class="num">100</span>);\n}\n<span class="cm">// 0,1,2 (let = new binding each)</span>\n\nconsole.log(x); <span class="cm">// ReferenceError (TDZ)</span>\n<span class="kw">let</span> x = <span class="num">5</span>;',
q:[{q:"What is the Temporal Dead Zone?",a:"Period between entering a block and let/const declaration. Variable exists but can't be accessed — throws ReferenceError."},{q:"Fix var-in-loop without let?",a:"IIFE: for(var i=0;i<3;i++){ (function(j){ setTimeout(()=>console.log(j),100) })(i) }"}]},
{id:"hoisting",n:"Hoisting & Execution Context",d:"beginner",
e:'JS engine creates <strong>Execution Context</strong>: <strong>Creation</strong> phase (allocate memory) then <strong>Execution</strong> (run code). Function declarations fully hoisted; var hoisted as undefined; let/const in TDZ.',
c:'greet(); <span class="cm">// Works! Fully hoisted</span>\n<span class="kw">function</span> greet() { <span class="kw">return</span> <span class="str">"Hello"</span>; }\n\nsayBye(); <span class="cm">// TypeError: not a function</span>\n<span class="kw">var</span> sayBye = <span class="kw">function</span>() { <span class="kw">return</span> <span class="str">"Bye"</span>; };\n\n<span class="cm">// Execution Context has:</span>\n<span class="cm">// 1. Variable Environment</span>\n<span class="cm">// 2. Scope Chain</span>\n<span class="cm">// 3. this binding</span>',
q:[{q:"Function declaration vs expression hoisting?",a:"Declarations: fully hoisted (name + body). Expressions: only variable hoisted (undefined for var, TDZ for let/const)."},{q:"Components of an Execution Context?",a:"Variable Environment, Scope Chain (outer references), and 'this' binding."}]},
{id:"strict",n:"Strict Mode & ES6+ Essentials",d:"beginner",
e:'"use strict" enables stricter parsing: no implicit globals, no duplicate params, this=undefined in functions. Key ES6+: destructuring, spread/rest, ?. (optional chaining), ?? (nullish coalescing).',
c:'<span class="str">"use strict"</span>;\nx = <span class="num">10</span>; <span class="cm">// ReferenceError!</span>\n\n<span class="cm">// Destructuring + defaults</span>\n<span class="kw">const</span> { name=<span class="str">"anon"</span>, age } = user;\n<span class="kw">const</span> [first, ...rest] = arr;\n\n<span class="cm">// ?. + ??</span>\n<span class="kw">const</span> city = user?.address?.city ?? <span class="str">"Unknown"</span>;\n<span class="cm">// ?? only for null/undefined</span>\n<span class="cm">// || triggers on ALL falsy (0, "")</span>',
q:[{q:"Difference between ?? and ||?",a:'|| returns right for ANY falsy. ?? only for null/undefined. Use ?? when 0 or "" are valid.'},{q:"3 things strict mode prevents?",a:"1) Undeclared variable assignment. 2) Duplicate params. 3) Deleting vars. Also: this=undefined in plain functions."}]},
{id:"tdz",n:"Temporal Dead Zone (TDZ)",d:"beginner",
e:'Think of TDZ like a "no-touch zone". When you use <strong>let</strong> or <strong>const</strong>, JavaScript KNOWS the variable exists (it\'s hoisted), but you\'re NOT allowed to use it until the line where it\'s declared. The gap between entering the scope and the declaration line is the TDZ — touching it throws a <strong>ReferenceError</strong>. <strong>var</strong> has no TDZ — it\'s just <strong>undefined</strong> before its line.',
c:'<span class="cm">// var — no TDZ, just undefined</span>\nconsole.log(a); <span class="cm">// undefined (hoisted)</span>\n<span class="kw">var</span> a = <span class="num">5</span>;\n\n<span class="cm">// let — TDZ! Can\'t touch before declaration</span>\nconsole.log(b); <span class="cm">// ❌ ReferenceError!</span>\n<span class="kw">let</span> b = <span class="num">5</span>;\n\n<span class="cm">// TDZ even inside same block</span>\n{\n  <span class="cm">// TDZ starts here for \'x\'</span>\n  <span class="kw">const</span> fn = () =&gt; x; <span class="cm">// OK to define, not call</span>\n  <span class="cm">// TDZ zone...</span>\n  <span class="kw">let</span> x = <span class="num">42</span>; <span class="cm">// TDZ ends here</span>\n  fn(); <span class="cm">// ✅ Now safe to call — x exists</span>\n}\n\n<span class="cm">// Tricky: typeof in TDZ also throws!</span>\n<span class="kw">typeof</span> undeclaredVar; <span class="cm">// "undefined" (OK)</span>\n<span class="kw">typeof</span> letBeforeLine;  <span class="cm">// ❌ ReferenceError!</span>\n<span class="kw">let</span> letBeforeLine = <span class="num">1</span>;',
q:[{q:"What is the Temporal Dead Zone?",a:"It's the period between entering a scope and the let/const declaration line. The variable is hoisted (JS knows it exists) but accessing it throws ReferenceError. It exists to catch bugs — using a variable before declaring it is almost always a mistake."},{q:"Does typeof protect against TDZ?",a:"No! typeof undeclaredVar returns 'undefined' safely, but typeof on a let/const in TDZ still throws ReferenceError. This catches a common misconception."}]},
{id:"optchain",n:"Optional Chaining & Nullish Coalescing",d:"beginner",
e:'<strong>Optional chaining (?.) </strong> is like asking politely: "Do you have an address? If yes, what city?" If any part is null/undefined, it returns <strong>undefined</strong> instead of crashing. <strong>Nullish coalescing (??)</strong> provides a fallback but ONLY for null/undefined — unlike || which triggers on ALL falsy values (0, "", false). These two are best friends — use them together.',
c:'<span class="kw">const</span> user = { name: <span class="str">"Ali"</span>, address: <span class="kw">null</span> };\n\n<span class="cm">// ❌ Without ?. — crashes!</span>\nuser.address.city; <span class="cm">// TypeError: Cannot read \'city\' of null</span>\n\n<span class="cm">// ✅ With ?. — safe</span>\nuser.address?.city;         <span class="cm">// undefined (no crash!)</span>\nuser.friends?.[<span class="num">0</span>]?.name;    <span class="cm">// undefined (array access)</span>\nuser.greet?.();             <span class="cm">// undefined (function call)</span>\n\n<span class="cm">// ?? vs || — THE KEY DIFFERENCE</span>\n<span class="kw">const</span> score = <span class="num">0</span>;\nscore || <span class="num">10</span>;   <span class="cm">// 10 ← WRONG! 0 is valid score!</span>\nscore ?? <span class="num">10</span>;   <span class="cm">// 0  ← CORRECT! Only null/undefined triggers ??</span>\n\n<span class="kw">const</span> text = <span class="str">""</span>;\ntext || <span class="str">"default"</span>;  <span class="cm">// "default" (empty string is falsy)</span>\ntext ?? <span class="str">"default"</span>;  <span class="cm">// "" (empty string is NOT null)</span>\n\n<span class="cm">// Perfect combo</span>\n<span class="kw">const</span> city = user?.address?.city ?? <span class="str">"Unknown"</span>;',
q:[{q:"When would you use ?? instead of ||?",a:"When 0 or empty string are valid values. || replaces ALL falsy (0, '', false, NaN). ?? ONLY replaces null and undefined. Example: a score of 0 is valid — use ?? so it doesn't get replaced with a default."},{q:"Can you chain ?. with methods?",a:"Yes! obj.method?.() calls the method only if it exists. Also works with arrays: arr?.[0]?.name. It short-circuits — if any part is null/undefined, the whole chain returns undefined."}]},
{id:"arraymethods",n:"Array Methods Deep Dive",d:"beginner",
e:'Array methods are your bread and butter. <strong>map</strong>: transform each item (like a factory machine — items go in, different items come out). <strong>filter</strong>: keep only items that pass a test (like a bouncer — you pass or you don\'t). <strong>reduce</strong>: combine everything into one value (like a snowball rolling downhill — gets bigger each step). <strong>find</strong>: grab the first match. <strong>some/every</strong>: quick yes/no checks. <strong>flat/flatMap</strong>: flatten nested arrays.',
c:'<span class="kw">const</span> nums = [<span class="num">1</span>, <span class="num">2</span>, <span class="num">3</span>, <span class="num">4</span>, <span class="num">5</span>];\n\n<span class="cm">// map — transform each item</span>\nnums.map(n =&gt; n * <span class="num">2</span>);     <span class="cm">// [2, 4, 6, 8, 10]</span>\n\n<span class="cm">// filter — keep items that pass</span>\nnums.filter(n =&gt; n &gt; <span class="num">3</span>);   <span class="cm">// [4, 5]</span>\n\n<span class="cm">// reduce — combine into one value</span>\nnums.reduce((sum, n) =&gt; sum + n, <span class="num">0</span>); <span class="cm">// 15</span>\n\n<span class="cm">// find / findIndex</span>\nnums.find(n =&gt; n &gt; <span class="num">3</span>);      <span class="cm">// 4 (first match)</span>\nnums.findIndex(n =&gt; n &gt; <span class="num">3</span>); <span class="cm">// 3 (index of first match)</span>\n\n<span class="cm">// some / every</span>\nnums.some(n =&gt; n &gt; <span class="num">4</span>);   <span class="cm">// true (at least one?)</span>\nnums.every(n =&gt; n &gt; <span class="num">0</span>);  <span class="cm">// true (all of them?)</span>\n\n<span class="cm">// flat — flatten nested arrays</span>\n[[<span class="num">1</span>,<span class="num">2</span>],[<span class="num">3</span>,[<span class="num">4</span>]]].flat();     <span class="cm">// [1,2,3,[4]] (1 level)</span>\n[[<span class="num">1</span>,<span class="num">2</span>],[<span class="num">3</span>,[<span class="num">4</span>]]].flat(Infinity); <span class="cm">// [1,2,3,4] (all levels)</span>\n\n<span class="cm">// Chain them — very powerful!</span>\n<span class="kw">const</span> users = [{n:<span class="str">"Ali"</span>,age:<span class="num">25</span>},{n:<span class="str">"Bo"</span>,age:<span class="num">17</span>},{n:<span class="str">"Cat"</span>,age:<span class="num">30</span>}];\nusers\n  .filter(u =&gt; u.age &gt;= <span class="num">18</span>)\n  .map(u =&gt; u.n.toUpperCase());\n<span class="cm">// ["ALI", "CAT"]</span>',
q:[{q:"Difference between map and forEach?",a:"map returns a NEW array with transformed items. forEach returns undefined — it just loops. If you need the result, use map. If you just want side effects (logging, DOM changes), use forEach."},{q:"How does reduce work?",a:"reduce takes a callback(accumulator, currentItem) and an initial value. It loops through, passing the result of each step as the accumulator to the next. Without initial value, it uses the first element. Think of it as: start with seed, fold each item into it."},{q:"Implement flat(depth) from scratch?",a:"Recursive: for each item, if it's an array AND depth > 0, recursively flat(item, depth-1). Else push to result. Or iterative with stack."}]}
]},{p:2,t:"Functions & Closures",s:"The heart of JS interviews",topics:[
{id:"closures",n:"Closures — Deep Dive",d:"intermediate",
e:'A <strong>closure</strong> is a function that remembers its outer scope variables even after the outer function returns. Foundation for privacy, factories, memoization.',
c:'<span class="kw">function</span> <span class="fn">createCounter</span>() {\n  <span class="kw">let</span> count = <span class="num">0</span>;\n  <span class="kw">return</span> {\n    inc: () =&gt; ++count,\n    get: () =&gt; count\n  };\n}\n<span class="kw">const</span> c = createCounter();\nc.inc(); <span class="cm">// 1</span>\nc.inc(); <span class="cm">// 2</span>\nc.get(); <span class="cm">// 2 — count persists!</span>',
q:[{q:"What is a closure? Real-world use case?",a:"Function + its lexical environment. Uses: data privacy, event handlers, factories, memoization."},{q:"Write add(2)(3) → 5",a:"function add(a){ return function(b){ return a+b; } } — closure remembers 'a'."}]},
{id:"currying",n:"Currying & Partial Application",d:"intermediate",
e:'<strong>Currying</strong>: f(a,b,c) → f(a)(b)(c). <strong>Partial application</strong>: fix some args, return function for rest. Both use closures.',
c:'<span class="kw">function</span> <span class="fn">curry</span>(fn) {\n  <span class="kw">return</span> <span class="kw">function</span> curried(...args) {\n    <span class="kw">if</span> (args.length &gt;= fn.length)\n      <span class="kw">return</span> fn.apply(<span class="kw">this</span>, args);\n    <span class="kw">return</span> (...a2) =&gt; curried(...args,...a2);\n  };\n}\n\n<span class="kw">const</span> add = curry((a,b,c) =&gt; a+b+c);\nadd(<span class="num">1</span>)(<span class="num">2</span>)(<span class="num">3</span>); <span class="cm">// 6</span>\nadd(<span class="num">1</span>,<span class="num">2</span>)(<span class="num">3</span>); <span class="cm">// 6</span>\n\n<span class="cm">// Partial with bind</span>\n<span class="kw">const</span> dbl = ((a,b)=&gt;a*b).bind(<span class="kw">null</span>,<span class="num">2</span>);\ndbl(<span class="num">5</span>); <span class="cm">// 10</span>',
q:[{q:"Currying vs partial application?",a:"Currying: chain of unary functions. Partial: fix some args, return function for remaining — not necessarily one-at-a-time."},{q:"Implement generic curry.",a:"Check args.length >= fn.length. If yes, call. If not, return function collecting more args."}]},
{id:"hof",n:"Higher-Order Functions & Compose",d:"intermediate",
e:'<strong>HOF</strong>: takes/returns functions. map, filter, reduce are classics. <strong>Compose</strong>: chain functions — compose(f,g)(x) = f(g(x)). Pipe = left-to-right.',
c:'<span class="cm">// Compose (right-to-left)</span>\n<span class="kw">const</span> compose = (...fns) =&gt; x =&gt;\n  fns.reduceRight((a,fn) =&gt; fn(a), x);\n\n<span class="cm">// Pipe (left-to-right)</span>\n<span class="kw">const</span> pipe = (...fns) =&gt; x =&gt;\n  fns.reduce((a,fn) =&gt; fn(a), x);\n\n<span class="kw">const</span> process = pipe(\n  x =&gt; x * <span class="num">2</span>,\n  x =&gt; x + <span class="num">1</span>,\n  x =&gt; <span class="str">`Result: ${x}`</span>\n);\nprocess(<span class="num">5</span>); <span class="cm">// "Result: 11"</span>',
q:[{q:"Implement reduce from scratch.",a:"Loop array, pass accumulator + current to callback. Handle optional initial value (if none, use first element, start index 1)."},{q:"Compose vs pipe?",a:"compose: right-to-left f(g(x)). pipe: left-to-right g(f(x)). Pipe more readable."}]},
{id:"debounce",n:"Debounce, Throttle & Memoize",d:"intermediate",
e:'<strong>Debounce</strong>: wait N ms of inactivity (search input). <strong>Throttle</strong>: max once per N ms (scroll). <strong>Memoize</strong>: cache results. All must-know for senior roles.',
c:'<span class="kw">function</span> <span class="fn">debounce</span>(fn, ms) {\n  <span class="kw">let</span> t;\n  <span class="kw">return</span> (...a) =&gt; {\n    clearTimeout(t);\n    t = setTimeout(() =&gt; fn.apply(<span class="kw">this</span>,a), ms);\n  };\n}\n\n<span class="kw">function</span> <span class="fn">throttle</span>(fn, ms) {\n  <span class="kw">let</span> ok=<span class="kw">true</span>;\n  <span class="kw">return</span> (...a) =&gt; {\n    <span class="kw">if</span>(!ok) <span class="kw">return</span>;\n    fn.apply(<span class="kw">this</span>,a); ok=<span class="kw">false</span>;\n    setTimeout(()=&gt;ok=<span class="kw">true</span>, ms);\n  };\n}\n\n<span class="kw">function</span> <span class="fn">memoize</span>(fn) {\n  <span class="kw">const</span> cache = <span class="kw">new</span> Map();\n  <span class="kw">return</span> (...a) =&gt; {\n    <span class="kw">const</span> k = JSON.stringify(a);\n    <span class="kw">if</span>(cache.has(k)) <span class="kw">return</span> cache.get(k);\n    <span class="kw">const</span> r = fn.apply(<span class="kw">this</span>,a);\n    cache.set(k,r); <span class="kw">return</span> r;\n  };\n}',
q:[{q:"Debounce vs throttle — when?",a:"Debounce: search input (wait until typing stops). Throttle: scroll/resize (cap rate). Debounce delays; throttle limits."},{q:"Debounce with leading option?",a:"Add 'immediate' flag. If true, fire on first call, ignore during delay. Reset timer each call."}]},
{id:"callbind",n:"call, apply & bind",d:"intermediate",
e:'All three let you <strong>manually set "this"</strong>. Think of it like borrowing a tool: <strong>call</strong> = "Let me use your tool RIGHT NOW with these items" (comma-separated args). <strong>apply</strong> = "Same, but items are in a bag" (array of args). <strong>bind</strong> = "Make me a COPY of your tool that I can use later" (returns a new function).',
c:'<span class="kw">function</span> <span class="fn">greet</span>(greeting, punct) {\n  <span class="kw">return</span> <span class="str">`${greeting}, ${<span class="kw">this</span>.name}${punct}`</span>;\n}\n<span class="kw">const</span> user = { name: <span class="str">"Ali"</span> };\n\n<span class="cm">// call — invoke NOW, args as commas</span>\ngreet.call(user, <span class="str">"Hi"</span>, <span class="str">"!"</span>);   <span class="cm">// "Hi, Ali!"</span>\n\n<span class="cm">// apply — invoke NOW, args as array</span>\ngreet.apply(user, [<span class="str">"Hi"</span>, <span class="str">"!"</span>]); <span class="cm">// "Hi, Ali!"</span>\n\n<span class="cm">// bind — returns NEW function for later</span>\n<span class="kw">const</span> greetAli = greet.bind(user, <span class="str">"Hey"</span>);\ngreetAli(<span class="str">"?"</span>);  <span class="cm">// "Hey, Ali?" (can add more args later)</span>\n\n<span class="cm">// Real use: borrowing methods</span>\n<span class="kw">const</span> arr = {<span class="num">0</span>:<span class="str">"a"</span>, <span class="num">1</span>:<span class="str">"b"</span>, length:<span class="num">2</span>}; <span class="cm">// array-like</span>\nArray.prototype.slice.call(arr); <span class="cm">// ["a","b"]</span>\n\n<span class="cm">// Remember: C = Commas, A = Array, B = waits Behind</span>',
q:[{q:"Implement Function.prototype.bind from scratch.",a:"Return new function that calls original with saved this (via apply), merging saved args with new args: Function.prototype.myBind = function(ctx, ...args) { const fn = this; return function(...a2) { return fn.apply(ctx, [...args, ...a2]); }; }"},{q:"When to use call vs apply vs bind?",a:"call: borrow a method immediately with known args. apply: same but args are already in an array (useful with Math.max). bind: create a permanent version — great for event handlers and callbacks where you need 'this' locked in."}]},
{id:"memo",n:"Memoization — Caching Results",d:"intermediate",
e:'Memoization is like writing answers on a sticky note. If someone asks "What is 5 + 3?" and you already calculated it, just read the sticky note instead of doing the math again. You <strong>trade memory for speed</strong> — store results of expensive calculations so you never compute the same thing twice.',
c:'<span class="cm">// Basic memoize — single argument</span>\n<span class="kw">function</span> <span class="fn">memoize</span>(fn) {\n  <span class="kw">const</span> cache = <span class="kw">new</span> Map();\n  <span class="kw">return</span> <span class="kw">function</span>(...args) {\n    <span class="kw">const</span> key = JSON.stringify(args);\n    <span class="kw">if</span> (cache.has(key)) <span class="kw">return</span> cache.get(key);\n    <span class="kw">const</span> result = fn.apply(<span class="kw">this</span>, args);\n    cache.set(key, result);\n    <span class="kw">return</span> result;\n  };\n}\n\n<span class="cm">// Usage</span>\n<span class="kw">const</span> slowSquare = n =&gt; {\n  console.log(<span class="str">"Computing..."</span>); <span class="cm">// heavy work</span>\n  <span class="kw">return</span> n * n;\n};\n<span class="kw">const</span> fastSquare = memoize(slowSquare);\n\nfastSquare(<span class="num">5</span>); <span class="cm">// "Computing..." → 25</span>\nfastSquare(<span class="num">5</span>); <span class="cm">// 25 (instant! no log — from cache)</span>\nfastSquare(<span class="num">6</span>); <span class="cm">// "Computing..." → 36 (new input)</span>\n\n<span class="cm">// React version: useMemo</span>\n<span class="cm">// const sorted = useMemo(() => bigList.sort(), [bigList]);</span>',
q:[{q:"Implement a memoize function.",a:"Create a Map cache. Return wrapper function. Convert args to key (JSON.stringify). Check if key exists — if yes, return cached. If no, compute, store, return. Handle edge cases: objects as args (same stringify), cache size limits."},{q:"When NOT to memoize?",a:"When: function has side effects, results change over time, args are always unique, or memory is tight. Memoize works best for pure functions (same input = same output) called repeatedly with same args."}]}
]},{p:3,t:"Objects & Prototypes",s:"'this' is where it gets tricky",topics:[
{id:"this",n:"The 'this' Keyword — 4 Rules",d:"intermediate",
e:"<strong>'this'</strong> depends on HOW called. Priority: 1) <strong>new</strong>, 2) <strong>call/apply/bind</strong>, 3) <strong>obj.method()</strong>, 4) <strong>default</strong> (global/undefined). Arrow functions inherit this lexically.",
c:'<span class="kw">const</span> obj = {\n  name: <span class="str">"Alice"</span>,\n  greet() { <span class="kw">return this</span>.name; },\n  arrow: () =&gt; <span class="kw">this</span>.name <span class="cm">// outer!</span>\n};\nobj.greet();      <span class="cm">// "Alice" (implicit)</span>\nobj.arrow();      <span class="cm">// undefined (arrow)</span>\n\n<span class="kw">const</span> fn = obj.greet;\nfn();             <span class="cm">// undefined (default)</span>\nfn.call({name:<span class="str">"Bob"</span>}); <span class="cm">// "Bob" (explicit)</span>\n\n<span class="kw">function</span> User(n){<span class="kw">this</span>.name=n;}\n<span class="kw">new</span> User(<span class="str">"Eve"</span>).name; <span class="cm">// "Eve" (new)</span>',
q:[{q:"All 4 'this' rules?",a:"1) new: this=new object. 2) call/apply/bind: this=specified. 3) obj.method(): this=obj. 4) plain: this=global/undefined."},{q:"Why don't arrows have own 'this'?",a:"They lexically bind from enclosing scope. Great for callbacks, bad as methods or constructors."}]},
{id:"proto",n:"Prototypal Inheritance",d:"advanced",
e:'Every object has [[Prototype]] link. Property lookup walks the chain. <strong>Object.create()</strong> sets prototype. Class syntax is sugar over this.',
c:'<span class="kw">const</span> animal = { speak(){<span class="kw">return</span> <span class="str">"..."</span>} };\n<span class="kw">const</span> dog = Object.create(animal);\ndog.bark = () =&gt; <span class="str">"Woof!"</span>;\ndog.bark();  <span class="cm">// "Woof!" (own)</span>\ndog.speak(); <span class="cm">// "..." (prototype)</span>\n\n<span class="kw">class</span> Animal {\n  constructor(n){<span class="kw">this</span>.name=n;}\n  speak(){<span class="kw">return</span> <span class="str">`${this.name} speaks`</span>;}\n}\n<span class="kw">class</span> Dog <span class="kw">extends</span> Animal {\n  bark(){<span class="kw">return</span> <span class="str">`${this.name} barks`</span>;}\n}\n<span class="cm">// Dog.prototype.__proto__ === Animal.prototype</span>',
q:[{q:"Explain the prototype chain.",a:"JS checks object → __proto__ → __proto__.__proto__ → ... → Object.prototype (whose __proto__ is null)."},{q:"What does 'new' do? (4 steps)",a:"1) Create empty obj. 2) Set __proto__. 3) Call constructor with this=obj. 4) Return obj (unless constructor returns object)."}]},
{id:"desc",n:"Property Descriptors & Immutability",d:"advanced",
e:'Properties have descriptors: writable, enumerable, configurable. <strong>freeze</strong> (shallow!), <strong>seal</strong>, <strong>preventExtensions</strong> for immutability.',
c:'Object.defineProperty(obj, <span class="str">"id"</span>, {\n  value:<span class="num">42</span>, writable:<span class="kw">false</span>,\n  enumerable:<span class="kw">false</span>, configurable:<span class="kw">false</span>\n});\n\nObject.preventExtensions(o); <span class="cm">// no new props</span>\nObject.seal(o);   <span class="cm">// + no delete/reconfig</span>\nObject.freeze(o); <span class="cm">// + no modify</span>\n\n<span class="cm">// ⚠️ freeze is SHALLOW</span>\n<span class="kw">const</span> d = Object.freeze({n:{x:<span class="num">1</span>}});\nd.n.x = <span class="num">99</span>; <span class="cm">// Works!</span>\n\n<span class="kw">function</span> deepFreeze(o) {\n  Object.freeze(o);\n  Object.keys(o).forEach(k =&gt; {\n    <span class="kw">if</span>(<span class="kw">typeof</span> o[k]===<span class="str">"object"</span>) deepFreeze(o[k]);\n  });\n}',
q:[{q:"freeze vs seal vs preventExtensions?",a:"preventExtensions: no new props. seal: + no delete/reconfig. freeze: + no modify. All shallow."},{q:"Deep immutability?",a:"Recursive deepFreeze, Immer, or Immutable.js. structuredClone() for deep copies."}]},
{id:"shallowdeep",n:"Shallow vs Deep Copy",d:"intermediate",
e:'Imagine you photocopy a folder. A <strong>shallow copy</strong> copies the folder but the documents inside are still the SAME originals — change a document, it changes in both folders. A <strong>deep copy</strong> copies everything — folder AND all documents. Changing one doesn\'t affect the other. This is one of the MOST common sources of bugs!',
c:'<span class="kw">const</span> original = { name: <span class="str">"Ali"</span>, scores: [<span class="num">90</span>, <span class="num">85</span>] };\n\n<span class="cm">// ❌ Not a copy at all — same reference!</span>\n<span class="kw">const</span> ref = original;\nref.name = <span class="str">"Max"</span>;\noriginal.name; <span class="cm">// "Max" — both changed!</span>\n\n<span class="cm">// Shallow copy methods</span>\n<span class="kw">const</span> s1 = { ...original };          <span class="cm">// spread</span>\n<span class="kw">const</span> s2 = Object.assign({}, original); <span class="cm">// assign</span>\n<span class="kw">const</span> s3 = [...original.scores];       <span class="cm">// array spread</span>\n\ns1.name = <span class="str">"New"</span>;  <span class="cm">// ✅ original NOT affected</span>\ns1.scores.push(<span class="num">100</span>); <span class="cm">// ❌ original IS affected!</span>\n<span class="cm">// Because scores array is shared (same reference)</span>\n\n<span class="cm">// Deep copy methods</span>\n<span class="kw">const</span> d1 = structuredClone(original); <span class="cm">// ✅ Best! (modern)</span>\n<span class="kw">const</span> d2 = JSON.parse(JSON.stringify(original)); <span class="cm">// Works but...</span>\n<span class="cm">// JSON method FAILS on: functions, undefined, Date, Map, Set, RegExp</span>\n\nd1.scores.push(<span class="num">100</span>); <span class="cm">// ✅ original NOT affected!</span>',
q:[{q:"How do you deep clone an object?",a:"Best: structuredClone() — handles most types including Date, Map, Set, circular references. Old way: JSON.parse(JSON.stringify()) — but fails on functions, undefined, Date (becomes string), Map, Set. For complex cases: use a recursive function or lodash.cloneDeep."},{q:"Why does spread create a shallow copy?",a:"Spread (...) copies only the first level of properties. If a property VALUE is an object/array, it copies the REFERENCE (pointer), not the actual data. So nested objects are shared between original and copy. Change the nested object → both are affected."}]},
{id:"mapset",n:"Map vs Object & Set vs Array",d:"intermediate",
e:'<strong>Map</strong> is like a locker room — ANY key works (objects, numbers, even NaN). Objects only allow string/symbol keys. <strong>Set</strong> is like a guest list — each name appears only ONCE, automatically. Use Map when you need non-string keys or ordered iteration. Use Set when you need unique values.',
c:'<span class="cm">// MAP vs Object</span>\n<span class="kw">const</span> map = <span class="kw">new</span> Map();\nmap.set({id:<span class="num">1</span>}, <span class="str">"user1"</span>);  <span class="cm">// object as key! ✅</span>\nmap.set(<span class="num">42</span>, <span class="str">"answer"</span>);       <span class="cm">// number as key! ✅</span>\nmap.size;                      <span class="cm">// 2 (instant count)</span>\n\n<span class="cm">// Object can only use strings/symbols</span>\n<span class="kw">const</span> obj = {};\nobj[{id:<span class="num">1</span>}] = <span class="str">"user1"</span>;  <span class="cm">// key becomes "[object Object]" ❌</span>\n\n<span class="cm">// Map preserves insertion order</span>\n<span class="cm">// Map has .size (Object needs Object.keys().length)</span>\n<span class="cm">// Map is better for frequent add/delete</span>\n\n<span class="cm">// SET — unique values only</span>\n<span class="kw">const</span> set = <span class="kw">new</span> Set([<span class="num">1</span>,<span class="num">2</span>,<span class="num">2</span>,<span class="num">3</span>,<span class="num">3</span>]);\n[...set]; <span class="cm">// [1, 2, 3] — duplicates removed!</span>\n\n<span class="cm">// Quick unique array trick</span>\n<span class="kw">const</span> unique = [...<span class="kw">new</span> Set(array)];\n\n<span class="cm">// Set operations</span>\n<span class="kw">const</span> a = <span class="kw">new</span> Set([<span class="num">1</span>,<span class="num">2</span>,<span class="num">3</span>]);\n<span class="kw">const</span> b = <span class="kw">new</span> Set([<span class="num">2</span>,<span class="num">3</span>,<span class="num">4</span>]);\n<span class="kw">const</span> union = <span class="kw">new</span> Set([...a, ...b]);          <span class="cm">// {1,2,3,4}</span>\n<span class="kw">const</span> inter = <span class="kw">new</span> Set([...a].filter(x=&gt;b.has(x))); <span class="cm">// {2,3}</span>',
q:[{q:"When would you use Map over Object?",a:"Use Map when: (1) keys are not strings (objects, numbers), (2) you need ordered iteration, (3) you frequently add/delete keys, (4) you need .size. Use Object when: keys are strings and you need JSON serialization."},{q:"How do you remove duplicates from an array?",a:"Fastest: [...new Set(array)]. This works for primitives. For objects, you need to deduplicate by a specific property: array.filter((item, i, arr) => arr.findIndex(x => x.id === item.id) === i)."}]}

]},{p:4,t:"Async JavaScript",s:"Event loop, promises, async/await",topics:[
{id:"eventloop",n:"Event Loop & Microtasks",d:"advanced",
e:'Event loop: 1) <strong>Call stack</strong> (sync), 2) <strong>Microtasks</strong> (Promises — drain after EACH task), 3) <strong>Macrotasks</strong> (setTimeout). Order: sync → micro → rAF → paint → macro.',
c:'console.log(<span class="str">"1"</span>);\nsetTimeout(()=&gt;console.log(<span class="str">"2"</span>), <span class="num">0</span>);\nPromise.resolve()\n  .then(()=&gt;console.log(<span class="str">"3"</span>))\n  .then(()=&gt;console.log(<span class="str">"4"</span>));\nconsole.log(<span class="str">"5"</span>);\n\n<span class="cm">// Output: 1, 5, 3, 4, 2</span>\n<span class="cm">// sync(1,5) → micro(3,4) → macro(2)</span>',
q:[{q:"Predict output of log+setTimeout+Promise",a:"Sync first, then ALL microtasks (Promise.then), then macrotasks (setTimeout). Micro queue fully drained before any macro."},{q:"Where does rAF fit?",a:"After microtasks, before paint. Once per frame (~16ms). Neither micro nor macro — it's a rendering callback."}]},
{id:"promises",n:"Promises & Combinators",d:"intermediate",
e:'States: pending→fulfilled/rejected. <strong>all</strong> (all succeed), <strong>allSettled</strong> (wait all), <strong>race</strong> (first settle), <strong>any</strong> (first fulfill).',
c:'fetch(<span class="str">"/api/user"</span>)\n  .then(r =&gt; r.json())\n  .then(u =&gt; fetch(<span class="str">`/api/posts/${u.id}`</span>))\n  .catch(console.error);\n\n<span class="kw">await</span> Promise.all([p1,p2]);\n<span class="cm">// Fails fast if ANY rejects</span>\n\n<span class="kw">await</span> Promise.allSettled([p1,p2]);\n<span class="cm">// [{status,value/reason}]</span>\n\n<span class="kw">await</span> Promise.race([p1,p2]);\n<span class="cm">// First to settle</span>\n\n<span class="kw">await</span> Promise.any([p1,p2]);\n<span class="cm">// First to fulfill</span>',
q:[{q:"all vs race vs any vs allSettled?",a:"all: all succeed or fail fast. allSettled: all finish. race: first settle. any: first fulfill (ignores rejects)."},{q:"Implement Promise.all",a:"Return new Promise. Track results[] + count. On each resolve: store, count++, if done resolve. On any reject: reject immediately."}]},
{id:"async",n:"Async/Await Pitfalls",d:"intermediate",
e:'async/await = sugar over Promises. Pitfalls: sequential awaits when parallel works, missing error handling, forgetting await returns Promise object.',
c:'<span class="cm">// ❌ Sequential — SLOW (2s)</span>\n<span class="kw">const</span> a = <span class="kw">await</span> fetchUser();\n<span class="kw">const</span> b = <span class="kw">await</span> fetchPosts();\n\n<span class="cm">// ✅ Parallel — FAST (1s)</span>\n<span class="kw">const</span> [a,b] = <span class="kw">await</span> Promise.all([\n  fetchUser(), fetchPosts()\n]);\n\n<span class="cm">// Go-style error wrapper</span>\n<span class="kw">const</span> to = p =&gt;\n  p.then(d=&gt;[<span class="kw">null</span>,d]).catch(e=&gt;[e,<span class="kw">null</span>]);\n<span class="kw">const</span> [err,data] = <span class="kw">await</span> to(fetchData());',
q:[{q:"Parallel vs sequential async?",a:"Parallel: fire all, await Promise.all(). Sequential: await each. Parallel = dramatically faster for independent calls."},{q:"Forget to await — what happens?",a:"Get Promise object instead of value. Code continues without waiting — subtle order bugs."}]},
{id:"gen",n:"Generators & Iterators",d:"advanced",
e:'<strong>Generators</strong> pause (yield) and resume (next()). Used for lazy eval, infinite sequences, async flow (redux-saga). Iterator protocol: [Symbol.iterator]() → {next()}.',
c:'<span class="kw">function*</span> range(s, e) {\n  <span class="kw">for</span>(<span class="kw">let</span> i=s; i&lt;=e; i++) <span class="kw">yield</span> i;\n}\n<span class="kw">const</span> g = range(<span class="num">1</span>,<span class="num">3</span>);\ng.next(); <span class="cm">// {value:1, done:false}</span>\ng.next(); <span class="cm">// {value:2, done:false}</span>\ng.next(); <span class="cm">// {value:3, done:false}</span>\ng.next(); <span class="cm">// {done:true}</span>\n\n<span class="cm">// Infinite fibonacci</span>\n<span class="kw">function*</span> fib() {\n  <span class="kw">let</span> [a,b]=[<span class="num">0</span>,<span class="num">1</span>];\n  <span class="kw">while</span>(<span class="kw">true</span>){<span class="kw">yield</span> a;[a,b]=[b,a+b];}\n}',
q:[{q:"Generators vs regular functions?",a:"Generators pause/resume maintaining state. Regular functions run to completion."},{q:"Practical generator use cases?",a:"Lazy evaluation, custom iterables, pagination, async flow control (redux-saga)."}]},
{id:"errors",n:"Error Handling Patterns",d:"intermediate",
e:'Error handling is like wearing a seatbelt — you hope you never need it, but when things crash, it saves you. <strong>try/catch</strong> catches errors. <strong>finally</strong> ALWAYS runs (cleanup). You can create <strong>custom error classes</strong> to make debugging easier. In async code, unhandled rejections are SILENT killers — always catch them.',
c:'<span class="cm">// Basic try/catch/finally</span>\n<span class="kw">try</span> {\n  <span class="kw">const</span> data = JSON.parse(badInput);\n} <span class="kw">catch</span> (err) {\n  console.error(err.message); <span class="cm">// what went wrong</span>\n  console.error(err.stack);   <span class="cm">// where it happened</span>\n} <span class="kw">finally</span> {\n  cleanup(); <span class="cm">// ALWAYS runs (even after return!)</span>\n}\n\n<span class="cm">// Custom Error — much better debugging</span>\n<span class="kw">class</span> ValidationError <span class="kw">extends</span> Error {\n  <span class="kw">constructor</span>(field, msg) {\n    <span class="kw">super</span>(msg);\n    <span class="kw">this</span>.name = <span class="str">"ValidationError"</span>;\n    <span class="kw">this</span>.field = field;\n  }\n}\n\n<span class="cm">// Catch specific types</span>\n<span class="kw">try</span> {\n  validate(input);\n} <span class="kw">catch</span> (e) {\n  <span class="kw">if</span> (e <span class="kw">instanceof</span> ValidationError)\n    showFieldError(e.field, e.message);\n  <span class="kw">else throw</span> e; <span class="cm">// re-throw unknown errors!</span>\n}\n\n<span class="cm">// Async error — always catch!</span>\nasync <span class="kw">function</span> load() {\n  <span class="kw">try</span> {\n    <span class="kw">const</span> res = <span class="kw">await</span> fetch(url);\n    <span class="kw">if</span> (!res.ok) <span class="kw">throw new</span> Error(<span class="str">`HTTP ${res.status}`</span>);\n  } <span class="kw">catch</span> (e) { handleError(e); }\n}',
q:[{q:"Why create custom Error classes?",a:"Custom errors let you: (1) distinguish error types with instanceof, (2) add extra properties (field, statusCode), (3) handle different errors differently. Example: catch ValidationError → show form error. Catch NetworkError → show 'check internet'. Always extend Error so stack traces work."},{q:"What happens with unhandled Promise rejections?",a:"In browsers: fires 'unhandledrejection' event, logged as warning. In Node: crashes the process (Node 15+). Always add .catch() or use try/catch with await. Add a global handler: window.addEventListener('unhandledrejection', e => log(e.reason))."}]}

]},{p:5,t:"Advanced Patterns",s:"Proxies, WeakMaps, design patterns",topics:[
{id:"proxy",n:"Proxy & Reflect",d:"advanced",
e:'<strong>Proxy</strong> intercepts object operations via traps. <strong>Reflect</strong> provides defaults. Used for validation, reactive systems (Vue 3), logging.',
c:'<span class="kw">const</span> v = <span class="kw">new</span> Proxy({}, {\n  set(t,p,val) {\n    <span class="kw">if</span>(p===<span class="str">"age"</span> &amp;&amp; <span class="kw">typeof</span> val!==<span class="str">"number"</span>)\n      <span class="kw">throw</span> <span class="kw">new</span> TypeError(<span class="str">"Must be number"</span>);\n    <span class="kw">return</span> Reflect.set(t,p,val);\n  },\n  get(t,p) {\n    <span class="kw">return</span> p <span class="kw">in</span> t ? t[p] : <span class="str">`Not found`</span>;\n  }\n});\nv.age = <span class="num">25</span>;    <span class="cm">// OK</span>\nv.age = <span class="str">"old"</span>; <span class="cm">// TypeError!</span>',
q:[{q:"Vue 3 reactivity vs Vue 2?",a:"Vue 2: Object.defineProperty (can't detect new props). Vue 3: Proxy (catches everything). More complete and performant."},{q:"Why Reflect with Proxy?",a:"Reflect provides correct default behavior (prototype chain traversal) vs direct property access."}]},
{id:"weakmap",n:"WeakMap, WeakSet & Memory",d:"advanced",
e:'<strong>WeakMap/WeakSet</strong>: weak references — keys can be GC\'d when no other refs exist. Keys must be objects. Not iterable. Great for private data, DOM metadata caching.',
c:'<span class="kw">const</span> _priv = <span class="kw">new</span> WeakMap();\n<span class="kw">class</span> User {\n  constructor(name, secret) {\n    <span class="kw">this</span>.name = name;\n    _priv.set(<span class="kw">this</span>, {secret});\n  }\n  getSecret() {\n    <span class="kw">return</span> _priv.get(<span class="kw">this</span>).secret;\n  }\n}\n\n<span class="cm">// DOM metadata — no leaks!</span>\n<span class="kw">const</span> clicks = <span class="kw">new</span> WeakMap();\n<span class="kw">function</span> handleClick(el) {\n  clicks.set(el, (clicks.get(el)||<span class="num">0</span>)+<span class="num">1</span>);\n  <span class="cm">// Element removed → auto-collected</span>\n}',
q:[{q:"WeakMap vs Map — when?",a:"WeakMap when keys are objects and you don't want to prevent GC. Classic: caching data for DOM elements — auto-cleans on removal."},{q:"Why can't you iterate WeakMap?",a:"Entries can be GC'd anytime. Iteration would keep everything alive, defeating the purpose."}]},
{id:"patterns",n:"Design Patterns",d:"advanced",
e:'Key: <strong>Pub/Sub</strong> (loose coupling), <strong>Module</strong> (encapsulation), <strong>Factory</strong> (creation), <strong>Singleton</strong> (shared state), <strong>Strategy</strong> (swappable algos).',
c:'<span class="kw">class</span> EventBus {\n  #subs = <span class="kw">new</span> Map();\n  on(evt, cb) {\n    <span class="kw">if</span>(!<span class="kw">this</span>.#subs.has(evt))\n      <span class="kw">this</span>.#subs.set(evt, <span class="kw">new</span> Set());\n    <span class="kw">this</span>.#subs.get(evt).add(cb);\n    <span class="kw">return</span> ()=&gt;<span class="kw">this</span>.#subs.get(evt).delete(cb);\n  }\n  emit(evt, data) {\n    <span class="kw">this</span>.#subs.get(evt)?.forEach(cb=&gt;cb(data));\n  }\n}\n\n<span class="cm">// Singleton</span>\n<span class="kw">const</span> Store = (()=&gt;{\n  <span class="kw">let</span> i;\n  <span class="kw">return</span> {get(){<span class="kw">if</span>(!i)i={s:{}};<span class="kw">return</span> i;}};\n})();',
q:[{q:"Pub/Sub vs Observer?",a:"Observer: direct notify (tight coupling). Pub/Sub: event bus middleman (loose). Pub/Sub preferred in large apps."},{q:"Factory pattern in React?",a:"Creating component types from config, form fields from schema, API clients with different interceptors."}]},
{id:"modules",n:"ESM vs CommonJS",d:"intermediate",
e:'<strong>CJS</strong> (require): sync, Node, dynamic, copies values. <strong>ESM</strong> (import): async, static, tree-shakable, live bindings. ESM is the future.',
c:'<span class="cm">// CommonJS</span>\n<span class="kw">const</span> lib = require(<span class="str">"./lib"</span>);\nmodule.exports = { foo };\n\n<span class="cm">// ES Modules</span>\n<span class="kw">import</span> { foo } <span class="kw">from</span> <span class="str">"./lib.js"</span>;\n<span class="kw">export const</span> foo = <span class="num">42</span>;\n<span class="kw">export default class</span> App {}\n\n<span class="cm">// Dynamic import (code splitting)</span>\n<span class="kw">const</span> mod = <span class="kw">await</span> import(<span class="str">"./heavy.js"</span>);\n\n<span class="cm">// CJS: copies values</span>\n<span class="cm">// ESM: live bindings (see changes)</span>\n<span class="cm">// ESM: enables tree-shaking</span>',
q:[{q:"Why ESM better for tree-shaking?",a:"Static structure — imports analyzed at compile time. Bundlers remove unused exports. CJS is dynamic, can't analyze."},{q:"What are live bindings?",a:"ESM imports are live references. If exporter changes value, importer sees it. CJS copies at require time."}]},
{id:"polyfills",n:"Polyfill Coding Challenges",d:"advanced",
e:'A <strong>polyfill</strong> is your own version of a built-in function. Interviewers LOVE asking "implement Promise.all" or "write your own map". It proves you deeply understand HOW things work, not just how to USE them. These are among the most common senior-level coding questions.',
c:'<span class="cm">// Implement Array.prototype.map</span>\nArray.prototype.myMap = <span class="kw">function</span>(cb) {\n  <span class="kw">const</span> result = [];\n  <span class="kw">for</span> (<span class="kw">let</span> i = <span class="num">0</span>; i &lt; <span class="kw">this</span>.length; i++) {\n    result.push(cb(<span class="kw">this</span>[i], i, <span class="kw">this</span>));\n  }\n  <span class="kw">return</span> result;\n};\n\n<span class="cm">// Implement Promise.all</span>\n<span class="kw">function</span> <span class="fn">promiseAll</span>(promises) {\n  <span class="kw">return new</span> Promise((resolve, reject) =&gt; {\n    <span class="kw">const</span> results = [];\n    <span class="kw">let</span> count = <span class="num">0</span>;\n    <span class="kw">if</span> (promises.length === <span class="num">0</span>) <span class="kw">return</span> resolve([]);\n    promises.forEach((p, i) =&gt; {\n      Promise.resolve(p).then(val =&gt; {\n        results[i] = val;  <span class="cm">// preserve order!</span>\n        <span class="kw">if</span> (++count === promises.length) resolve(results);\n      }).catch(reject);   <span class="cm">// fail fast</span>\n    });\n  });\n}\n\n<span class="cm">// Implement Function.prototype.bind</span>\nFunction.prototype.myBind = <span class="kw">function</span>(ctx, ...args) {\n  <span class="kw">const</span> fn = <span class="kw">this</span>;\n  <span class="kw">return function</span>(...newArgs) {\n    <span class="kw">return</span> fn.apply(ctx, [...args, ...newArgs]);\n  };\n};',
q:[{q:"Implement Promise.all.",a:"Return new Promise. Track results array and completed count. For each promise: on resolve, store at correct index, increment count — when count equals total, resolve with results. On any reject, reject immediately. Wrap each item in Promise.resolve() to handle non-promise values."},{q:"Implement Array.prototype.filter.",a:"Loop through array, call callback(item, index, array). If callback returns truthy, push item to results. Return results. Remember: don't modify original array, pass all 3 arguments to callback."}]},
{id:"flatten",n:"Flatten Array & Deep Clone",d:"advanced",
e:'These are the two most common "write it from scratch" coding questions. <strong>Flatten</strong>: turn nested arrays into a single flat array. <strong>Deep clone</strong>: create a perfect copy of an object with all nested levels. Both require <strong>recursion</strong> — the technique where a function calls itself to handle smaller pieces.',
c:'<span class="cm">// Flatten array — recursive</span>\n<span class="kw">function</span> <span class="fn">flatten</span>(arr, depth = <span class="num">1</span>) {\n  <span class="kw">const</span> result = [];\n  <span class="kw">for</span> (<span class="kw">const</span> item <span class="kw">of</span> arr) {\n    <span class="kw">if</span> (Array.isArray(item) &amp;&amp; depth &gt; <span class="num">0</span>) {\n      result.push(...flatten(item, depth - <span class="num">1</span>));\n    } <span class="kw">else</span> {\n      result.push(item);\n    }\n  }\n  <span class="kw">return</span> result;\n}\nflatten([<span class="num">1</span>,[<span class="num">2</span>,[<span class="num">3</span>,[<span class="num">4</span>]]]], Infinity); <span class="cm">// [1,2,3,4]</span>\n\n<span class="cm">// Deep clone — handle all types</span>\n<span class="kw">function</span> <span class="fn">deepClone</span>(obj, seen = <span class="kw">new</span> WeakMap()) {\n  <span class="kw">if</span> (obj === <span class="kw">null</span> || <span class="kw">typeof</span> obj !== <span class="str">"object"</span>) <span class="kw">return</span> obj;\n  <span class="kw">if</span> (seen.has(obj)) <span class="kw">return</span> seen.get(obj); <span class="cm">// circular ref!</span>\n  <span class="kw">if</span> (obj <span class="kw">instanceof</span> Date) <span class="kw">return new</span> Date(obj);\n  <span class="kw">if</span> (obj <span class="kw">instanceof</span> RegExp) <span class="kw">return new</span> RegExp(obj);\n  \n  <span class="kw">const</span> clone = Array.isArray(obj) ? [] : {};\n  seen.set(obj, clone);\n  <span class="kw">for</span> (<span class="kw">const</span> key <span class="kw">of</span> Object.keys(obj)) {\n    clone[key] = deepClone(obj[key], seen);\n  }\n  <span class="kw">return</span> clone;\n}\n<span class="cm">// Or just: structuredClone(obj) (modern native!)</span>',
q:[{q:"Implement a deep clone function.",a:"Recursively copy: check if value is null/primitive (return as-is), handle Date/RegExp/Map/Set specially, create empty object/array, loop through keys and recursively clone each value. CRITICAL: use a WeakMap to track seen objects to handle circular references."},{q:"Flatten without recursion?",a:"Use a stack/queue: const stack = [...arr]; while (stack.length) { const item = stack.pop(); if (Array.isArray(item)) stack.push(...item); else result.push(item); } result.reverse(). Iterative avoids stack overflow on deeply nested arrays."}]}

]},{p:6,t:"DOM, Browser & Performance",s:"Real-world frontend mastery",topics:[
{id:"crp",n:"Critical Rendering Path",d:"advanced",
e:'Browser: HTML→DOM, CSS→CSSOM, Render Tree → <strong>Layout</strong> (geometry) → <strong>Paint</strong> (pixels) → <strong>Composite</strong> (layers). Use transform/opacity to skip layout+paint.',
c:'<span class="cm">// Layout thrashing — BAD</span>\nels.forEach(el =&gt; {\n  <span class="kw">const</span> h = el.offsetHeight; <span class="cm">// force layout</span>\n  el.style.height = h+<span class="num">10</span>+<span class="str">"px"</span>; <span class="cm">// invalidate</span>\n});\n\n<span class="cm">// Batch reads/writes — GOOD</span>\n<span class="kw">const</span> hs = els.map(e=&gt;e.offsetHeight);\nels.forEach((e,i)=&gt;e.style.height=hs[i]+<span class="num">10</span>+<span class="str">"px"</span>);\n\n<span class="cm">// transform = compositor only</span>\nel.style.transform = <span class="str">"translateX(100px)"</span>;',
q:[{q:"Layout vs paint triggers?",a:"Layout: geometry (width, height, margin). Paint: visual (color, background). transform/opacity skip both — compositor only."},{q:"Fix layout thrashing?",a:"Batch reads before writes, rAF, DocumentFragment, prefer transform/opacity."}]},
{id:"events",n:"Event Delegation",d:"intermediate",
e:'Events: <strong>Capture</strong> (root→target) → <strong>Target</strong> → <strong>Bubble</strong> (target→root). <strong>Delegation</strong> = one parent listener vs many children. Essential for dynamic lists.',
c:'<span class="cm">// Event delegation</span>\ndocument.querySelector(<span class="str">"#list"</span>)\n  .addEventListener(<span class="str">"click"</span>, e =&gt; {\n    <span class="kw">const</span> item = e.target.closest(<span class="str">"[data-id]"</span>);\n    <span class="kw">if</span>(!item) <span class="kw">return</span>;\n    handleClick(item.dataset.id);\n  });\n\ne.stopPropagation();    <span class="cm">// stop bubble</span>\ne.preventDefault();     <span class="cm">// cancel default</span>\n\n<span class="cm">// focus/blur don\'t bubble!</span>\n<span class="cm">// Use capture or focusin/focusout</span>',
q:[{q:"Why event delegation?",a:"1 listener vs 1000. Works for dynamic elements. Example: <ul> listener handles all <li> clicks."},{q:"stopPropagation vs preventDefault?",a:"stopPropagation: stops reaching other elements. preventDefault: cancels browser default (form submit, link). Independent."}]},
{id:"webapi",n:"Modern Web APIs",d:"intermediate",
e:'<strong>IntersectionObserver</strong> (lazy load), <strong>AbortController</strong> (cancel fetch), <strong>ResizeObserver</strong>, <strong>MutationObserver</strong>, <strong>structuredClone</strong> (deep copy), <strong>Web Workers</strong>.',
c:'<span class="cm">// IntersectionObserver — lazy images</span>\n<span class="kw">const</span> io = <span class="kw">new</span> IntersectionObserver(entries=&gt;{\n  entries.forEach(e =&gt; {\n    <span class="kw">if</span>(e.isIntersecting) {\n      e.target.src = e.target.dataset.src;\n      io.unobserve(e.target);\n    }\n  });\n}, {rootMargin:<span class="str">"200px"</span>});\n\n<span class="cm">// AbortController</span>\n<span class="kw">const</span> ac = <span class="kw">new</span> AbortController();\nfetch(url, {signal:ac.signal});\nac.abort(); <span class="cm">// cancels!</span>\n\n<span class="cm">// Deep copy (native!)</span>\n<span class="kw">const</span> copy = structuredClone(obj);',
q:[{q:"Implement infinite scroll?",a:"IntersectionObserver on sentinel element. When visible, fetch more. Better than scroll + getBoundingClientRect."},{q:"Cancel in-flight fetch?",a:"AbortController: create, pass signal, call abort(). Rejects with AbortError. Essential for search-as-you-type."}]},
{id:"perf",n:"Performance Optimization",d:"advanced",
e:'<strong>Code splitting</strong> (dynamic import), <strong>tree shaking</strong> (ESM), <strong>resource hints</strong> (preload/prefetch/preconnect), <strong>Core Web Vitals</strong> (LCP<2.5s, INP<200ms, CLS<0.1), <strong>virtualization</strong>.',
c:'<span class="cm">// Code splitting</span>\n<span class="kw">const</span> load = () =&gt; import(<span class="str">"./Editor.js"</span>);\n\n<span class="cm">// Resource hints</span>\n<span class="cm">// preload: fetch NOW, current page</span>\n<span class="cm">// prefetch: fetch idle, NEXT page</span>\n<span class="cm">// preconnect: early DNS+TCP+TLS</span>\n\n<span class="cm">// Core Web Vitals</span>\n<span class="cm">// LCP &lt; 2.5s (largest paint)</span>\n<span class="cm">// INP &lt; 200ms (interaction delay)</span>\n<span class="cm">// CLS &lt; 0.1 (layout shift)</span>\n\nperformance.mark(<span class="str">"start"</span>);\n<span class="cm">// ...work</span>\nperformance.mark(<span class="str">"end"</span>);\nperformance.measure(<span class="str">"op"</span>,<span class="str">"start"</span>,<span class="str">"end"</span>);',
q:[{q:"Core Web Vitals + optimization?",a:"LCP: preload hero, SSR. INP: code split, workers. CLS: set image dims, avoid injecting above viewport."},{q:"preload vs prefetch vs preconnect?",a:"preload: NOW, current page. prefetch: idle, next page. preconnect: early connection handshake."}]}
]},{p:7,t:"System Design",s:"Senior-level architecture",topics:[
{id:"state",n:"State Management",d:"advanced",
e:'Different state needs different tools: <strong>UI</strong> (useState), <strong>Client</strong> (Zustand/Redux), <strong>Server</strong> (React Query/SWR). Key: don\'t put server state in Redux.',
c:'<span class="cm">// Categories</span>\n<span class="cm">// UI State → useState/useReducer</span>\n<span class="cm">// Client State → Zustand/Redux</span>\n<span class="cm">// Server State → React Query/SWR</span>\n\n<span class="cm">// Zustand</span>\n<span class="kw">const</span> useStore = create(set =&gt; ({\n  count: <span class="num">0</span>,\n  inc: () =&gt; set(s=&gt;({count:s.count+<span class="num">1</span>}))\n}));\n\n<span class="cm">// React Query</span>\n<span class="kw">const</span> {data} = useQuery({\n  queryKey:[<span class="str">"users"</span>],\n  queryFn: fetchUsers,\n  staleTime: <span class="num">5</span>*<span class="num">60</span>*<span class="num">1000</span>\n});',
q:[{q:"Redux vs Context vs React Query?",a:"Context: low-frequency (theme, auth). Redux/Zustand: complex client state. React Query: API data. Never server state in Redux."},{q:"What does React Query solve?",a:"Caching, background refetch, stale-while-revalidate, pagination, optimistic updates, request dedup."}]},
{id:"security",n:"Frontend Security",d:"advanced",
e:'<strong>XSS</strong>: inject scripts (use textContent, DOMPurify, CSP). <strong>CSRF</strong>: forge actions (SameSite cookies, CSRF tokens). <strong>Clickjacking</strong>: X-Frame-Options.',
c:'<span class="cm">// ❌ XSS vulnerable</span>\nel.innerHTML = userInput;\n\n<span class="cm">// ✅ Safe</span>\nel.textContent = userInput;\nel.innerHTML = DOMPurify.sanitize(html);\n\n<span class="cm">// CSP Header</span>\n<span class="cm">// Content-Security-Policy:</span>\n<span class="cm">//   default-src \'self\';</span>\n<span class="cm">//   script-src \'self\' \'nonce-abc\'</span>\n\n<span class="cm">// CSRF: SameSite cookies, tokens</span>\n<span class="cm">// Clickjacking: X-Frame-Options</span>',
q:[{q:"Prevent XSS in React?",a:"React auto-escapes. Dangers: dangerouslySetInnerHTML (use DOMPurify), javascript: URLs. Sanitize both client+server."},{q:"Explain CSRF + prevention.",a:"Attacker tricks auth user into request. Prevent: SameSite cookies, CSRF tokens, verify Origin header."}]},
{id:"testing",n:"Testing Strategy",d:"intermediate",
e:'<strong>Testing Trophy</strong>: Integration > Unit > E2E. Test behavior, not implementation. Use Testing Library (getByRole), MSW (mock API), Playwright (E2E).',
c:'test(<span class="str">"user submits form"</span>, <span class="kw">async</span>()=&gt;{\n  render(&lt;ContactForm/&gt;);\n  <span class="kw">await</span> userEvent.type(\n    screen.getByRole(<span class="str">"textbox"</span>,{name:<span class="str">/email/i</span>}),\n    <span class="str">"test@mail.com"</span>\n  );\n  <span class="kw">await</span> userEvent.click(\n    screen.getByRole(<span class="str">"button"</span>,{name:<span class="str">/submit/i</span>})\n  );\n  expect(\n    <span class="kw">await</span> screen.findByText(<span class="str">/success/i</span>)\n  ).toBeInTheDocument();\n});\n\n<span class="cm">// MSW mock</span>\nhttp.get(<span class="str">"/api/users"</span>,()=&gt;\n  HttpResponse.json([{id:<span class="num">1</span>}]));',
q:[{q:"'Test behavior, not implementation'?",a:"Test what user sees/does (click→result), not internals. Won't break on refactor. Use getByRole over test IDs."},{q:"Trophy vs Pyramid?",a:"Trophy: integration (most confidence). Pyramid: unit (most quantity). Trophy = modern frontend reality."}]},
{id:"arch",n:"Architecture Patterns",d:"advanced",
e:'<strong>Micro-frontends</strong> (independent deploy), <strong>Monorepo</strong> (Turborepo/Nx), <strong>Islands</strong> (Astro — partial hydration), <strong>RSC</strong> (React Server Components), <strong>BFF</strong>.',
c:'<span class="cm">// Web Components</span>\n<span class="kw">class</span> MyWidget <span class="kw">extends</span> HTMLElement {\n  connectedCallback() {\n    <span class="kw">this</span>.innerHTML = <span class="str">"&lt;h2&gt;Independent!&lt;/h2&gt;"</span>;\n  }\n}\ncustomElements.define(<span class="str">"my-widget"</span>,MyWidget);\n\n<span class="cm">// Decision framework:</span>\n<span class="cm">// Small team → Next.js/Remix</span>\n<span class="cm">// Large org  → Micro-frontends</span>\n<span class="cm">// Content    → Astro (Islands)</span>\n<span class="cm">// Complex    → RSC + Server Actions</span>',
q:[{q:"When micro-frontends?",a:"Large org, multiple teams, independent deploys. NOT small teams — overhead (shared deps, routing, style isolation) not worth it."},{q:"React Server Components?",a:"Render on server, send HTML not JS. Zero client bundle for server components, direct DB access, auto code splitting."}]}
]},{p:8,t:"🔥 Mock Interview",s:"Real questions from real interviews — practice these!",topics:[
{id:"output1",n:"Output Puzzle: Closures & Loops",d:"intermediate",
e:'This is the #1 most asked output question in JS interviews. It tests if you truly understand <strong>closures</strong>, <strong>var vs let</strong>, and how <strong>setTimeout</strong> works with the event loop. If you can explain this one clearly, you pass 50% of closure questions.',
c:'<span class="cm">// PUZZLE 1: What does this print?</span>\n<span class="kw">for</span> (<span class="kw">var</span> i = <span class="num">0</span>; i &lt; <span class="num">3</span>; i++) {\n  setTimeout(() =&gt; console.log(i), <span class="num">1000</span>);\n}\n\n<span class="cm">// ANSWER: 3, 3, 3 (NOT 0, 1, 2!)</span>\n<span class="cm">// WHY: var is function-scoped. There\'s only ONE \'i\'.</span>\n<span class="cm">// By the time setTimeout fires, loop is done, i = 3.</span>\n\n<span class="cm">// FIX 1: Use let (creates new i each iteration)</span>\n<span class="kw">for</span> (<span class="kw">let</span> i = <span class="num">0</span>; i &lt; <span class="num">3</span>; i++) {\n  setTimeout(() =&gt; console.log(i), <span class="num">1000</span>);\n}\n<span class="cm">// Output: 0, 1, 2 ✅</span>\n\n<span class="cm">// FIX 2: IIFE (creates new scope each iteration)</span>\n<span class="kw">for</span> (<span class="kw">var</span> i = <span class="num">0</span>; i &lt; <span class="num">3</span>; i++) {\n  ((<span class="kw">function</span>(j) {\n    setTimeout(() =&gt; console.log(j), <span class="num">1000</span>);\n  })(i));\n}\n<span class="cm">// Output: 0, 1, 2 ✅</span>',
q:[{q:"Explain step by step why it prints 3,3,3.",a:"1) var creates ONE variable 'i' for the whole function. 2) Loop runs: i=0,1,2,3 (stops at 3). 3) Three setTimeout callbacks are queued, each pointing to the SAME 'i'. 4) After 1 second, all 3 fire — i is now 3. 5) All print 3. Fix with 'let' (block scope = new binding per iteration) or IIFE."}]},
{id:"output2",n:"Output Puzzle: Event Loop Order",d:"advanced",
e:'This question appears in <strong>Google, Amazon, and Meta</strong> interviews. It tests your understanding of the event loop, microtasks vs macrotasks, and execution order. Get this right and you\'ve proven you understand async JavaScript deeply.',
c:'<span class="cm">// PUZZLE: What\'s the output ORDER?</span>\nconsole.log(<span class="str">"A"</span>);\n\nsetTimeout(() =&gt; console.log(<span class="str">"B"</span>), <span class="num">0</span>);\n\nPromise.resolve()\n  .then(() =&gt; console.log(<span class="str">"C"</span>))\n  .then(() =&gt; console.log(<span class="str">"D"</span>));\n\nsetTimeout(() =&gt; console.log(<span class="str">"E"</span>), <span class="num">0</span>);\n\nconsole.log(<span class="str">"F"</span>);\n\n<span class="cm">// ANSWER: A, F, C, D, B, E</span>\n\n<span class="cm">// STEP BY STEP:</span>\n<span class="cm">// 1. "A" — sync, runs immediately</span>\n<span class="cm">// 2. setTimeout(B) → goes to MACRO queue</span>\n<span class="cm">// 3. Promise.then(C) → goes to MICRO queue</span>\n<span class="cm">// 4. setTimeout(E) → goes to MACRO queue</span>\n<span class="cm">// 5. "F" — sync, runs immediately</span>\n<span class="cm">// 6. Stack empty → drain MICRO queue: C, then D</span>\n<span class="cm">// 7. Pick MACRO: B</span>\n<span class="cm">// 8. Pick MACRO: E</span>',
q:[{q:"What if we add process.nextTick() (Node.js)?",a:"process.nextTick runs BEFORE Promise microtasks. Order: sync → nextTick → Promise.then → setTimeout. nextTick is the highest priority async callback in Node."},{q:"What about queueMicrotask()?",a:"queueMicrotask() adds to the microtask queue, same priority as Promise.then. It runs before setTimeout but within the same microtask phase."}]},
{id:"output3",n:"Output Puzzle: this & Arrow Functions",d:"intermediate",
e:'This tests the #1 confusing thing in JavaScript — the <strong>this</strong> keyword. Interviewers love mixing regular functions and arrow functions in objects to see if you know the difference. Arrow functions DON\'T have their own this — they grab it from the parent scope.',
c:'<span class="cm">// PUZZLE: What does each log?</span>\n<span class="kw">const</span> obj = {\n  name: <span class="str">"Ali"</span>,\n  greet() {\n    console.log(<span class="str">"1:"</span>, <span class="kw">this</span>.name);\n    \n    <span class="kw">const</span> inner = <span class="kw">function</span>() {\n      console.log(<span class="str">"2:"</span>, <span class="kw">this</span>.name);\n    };\n    inner();\n    \n    <span class="kw">const</span> arrow = () =&gt; {\n      console.log(<span class="str">"3:"</span>, <span class="kw">this</span>.name);\n    };\n    arrow();\n  }\n};\nobj.greet();\n\n<span class="cm">// ANSWER:</span>\n<span class="cm">// 1: "Ali"     — obj.greet(), this = obj ✅</span>\n<span class="cm">// 2: undefined — inner() plain call, this = window/undefined ❌</span>\n<span class="cm">// 3: "Ali"     — arrow inherits greet\'s this = obj ✅</span>\n\n<span class="cm">// BONUS: What about this?</span>\n<span class="kw">const</span> fn = obj.greet;\nfn();  <span class="cm">// 1: undefined — lost the obj binding!</span>\n       <span class="cm">// When you extract a method, \'this\' is gone.</span>\n       <span class="cm">// Fix: const fn = obj.greet.bind(obj);</span>',
q:[{q:"Why does extracting a method lose 'this'?",a:"'this' in JS depends on HOW you call, not WHERE you define. obj.greet() → this=obj. But const fn = obj.greet; fn() → plain call → this=undefined (strict) or window. The dot before the () is what sets this. Fix: use .bind(), arrow wrapper, or call/apply."}]},
{id:"output4",n:"Output Puzzle: Hoisting & TDZ Traps",d:"intermediate",
e:'This tests whether you truly understand <strong>hoisting</strong>. Most candidates know "var is hoisted" but fail on function expression hoisting and the Temporal Dead Zone. These exact patterns show up in Amazon and Microsoft interviews.',
c:'<span class="cm">// PUZZLE 1: What happens?</span>\nconsole.log(a);  <span class="cm">// ?</span>\nconsole.log(b);  <span class="cm">// ?</span>\nconsole.log(c);  <span class="cm">// ?</span>\n\n<span class="kw">var</span> a = <span class="num">1</span>;\n<span class="kw">let</span> b = <span class="num">2</span>;\n<span class="kw">const</span> c = <span class="num">3</span>;\n\n<span class="cm">// ANSWER:</span>\n<span class="cm">// a → undefined (var hoisted, initialized as undefined)</span>\n<span class="cm">// b → ReferenceError! (let is in TDZ)</span>\n<span class="cm">// c → never reached (b already threw)</span>\n\n<span class="cm">// PUZZLE 2: What happens?</span>\nconsole.log(foo());  <span class="cm">// ?</span>\nconsole.log(bar());  <span class="cm">// ?</span>\n\n<span class="kw">function</span> <span class="fn">foo</span>() { <span class="kw">return</span> <span class="str">"hello"</span>; }  <span class="cm">// declaration</span>\n<span class="kw">var</span> bar = <span class="kw">function</span>() { <span class="kw">return</span> <span class="str">"world"</span>; };  <span class="cm">// expression</span>\n\n<span class="cm">// ANSWER:</span>\n<span class="cm">// foo() → "hello" ✅ (declaration fully hoisted)</span>\n<span class="cm">// bar() → TypeError! (var bar hoisted as undefined,</span>\n<span class="cm">//         undefined() is not a function!)</span>\n\n<span class="cm">// PUZZLE 3: Sneaky one</span>\n<span class="kw">var</span> x = <span class="num">1</span>;\n<span class="kw">function</span> <span class="fn">test</span>() {\n  console.log(x);  <span class="cm">// undefined! (not 1)</span>\n  <span class="kw">var</span> x = <span class="num">2</span>;       <span class="cm">// local var x hoisted inside function</span>\n}\ntest();',
q:[{q:"Why does Puzzle 3 print undefined instead of 1?",a:"The var x = 2 inside the function is hoisted to the top of the function, shadowing the global x. So when console.log runs, it sees the local x which exists but is undefined (hoisted but not yet assigned). This is called variable shadowing — the local declaration masks the global one."}]},
{id:"output5",n:"Output Puzzle: Promise Chains & Errors",d:"advanced",
e:'Promise chains are tricky because <strong>.catch() recovers</strong> — the chain continues after a catch! This catches most candidates off guard. Also tests: what does .then(value) do when value is not a function?',
c:'<span class="cm">// PUZZLE 1: What\'s the output?</span>\nPromise.resolve(<span class="num">1</span>)\n  .then(x =&gt; { <span class="kw">throw new</span> Error(<span class="str">"Oops"</span>); })\n  .then(x =&gt; console.log(<span class="str">"A"</span>, x))\n  .catch(e =&gt; {\n    console.log(<span class="str">"B"</span>, e.message);\n    <span class="kw">return</span> <span class="num">42</span>;\n  })\n  .then(x =&gt; console.log(<span class="str">"C"</span>, x));\n\n<span class="cm">// ANSWER:</span>\n<span class="cm">// "B Oops"  — catch handles the error</span>\n<span class="cm">// "C 42"    — chain CONTINUES after catch!</span>\n<span class="cm">// "A" is SKIPPED — error jumps to nearest catch</span>\n\n<span class="cm">// PUZZLE 2: Tricky .then() argument</span>\nPromise.resolve(<span class="num">1</span>)\n  .then(<span class="num">2</span>)          <span class="cm">// non-function → IGNORED</span>\n  .then(console.log) <span class="cm">// receives 1 (passed through!)</span>\n\n<span class="cm">// ANSWER: 1</span>\n<span class="cm">// .then(2) is like .then(undefined) → value passes through</span>\n\n<span class="cm">// PUZZLE 3: async/await trap</span>\n<span class="kw">async function</span> test() {\n  console.log(<span class="str">"A"</span>);\n  <span class="kw">const</span> x = <span class="kw">await</span> <span class="num">5</span>; <span class="cm">// await wraps in Promise.resolve</span>\n  console.log(<span class="str">"B"</span>, x);\n}\ntest();\nconsole.log(<span class="str">"C"</span>);\n<span class="cm">// Output: A, C, B 5</span>\n<span class="cm">// await pauses test(), C runs sync, then B resumes</span>',
q:[{q:"Why does .catch() allow the chain to continue?",a:".catch() returns a NEW resolved promise (unless it throws). So .then() after .catch() runs with whatever .catch() returned. Think of catch as a recovery point — it handles the error and the chain moves on. Only if catch itself throws does the error propagate further."},{q:"What does await 5 do?",a:"await wraps non-Promise values in Promise.resolve(). So await 5 becomes await Promise.resolve(5). This means EVERYTHING after await is pushed to the microtask queue, even if the value is already available. That's why console.log('C') runs before 'B'."}]},
{id:"gotcha1",n:"🧠 Gotcha: typeof & Equality Traps",d:"intermediate",
e:'These are the <strong>"warm-up gotcha" questions</strong> interviewers use in the first 5 minutes. They\'re quick, tricky, and test if you know JavaScript\'s weird parts. Getting these right builds confidence early. Getting them wrong puts you on the back foot immediately.',
